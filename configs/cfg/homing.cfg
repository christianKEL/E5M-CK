# ═══════════════════════════════════════════════════════
# HOMING — CoreXY sequence with Eddy probe Z refinement
#
# ⚠️  CRITICAL : axis order MUST be Y → X → Z
#    Reversing Y and X causes MECHANICAL CRASH on this E5M.
#    DO NOT swap the order without thorough mechanical review.
#
# Z=0 refinement strategy :
#   • Z not yet homed  → SET_Z_FROM_PROBE METHOD=scan  (no tap, dirty-nozzle safe)
#   • Z already homed  → SET_Z_FROM_PROBE METHOD=tap   (5-sample median)
#
# Note : set_position_z is intentionally NOT used here. Klipper marks Z as
# homed as soon as set_position_z is processed (before the gcode template
# runs), which would defeat the homed_axes detection. Instead, Z is faked
# via SET_KINEMATIC_POSITION only when actually unhomed.
# ═══════════════════════════════════════════════════════

[homing_override]
axes: xyz
gcode:
  G90
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% set z_was_homed = 'z' in printer.toolhead.homed_axes %}

  # ── Initial Z lift (avoid Eddy saturation / collisions during X/Y homing)
  {% if z_was_homed %}
    G91
    G1 Z30 F600
    G90
  {% else %}
    SET_KINEMATIC_POSITION Z=0
    G1 Z30 F600
  {% endif %}

  # ─── Y axis (must be homed BEFORE X — see header warning) ───
  {% if home_all or 'X' in params or 'Y' in params %}
    G28 Y
    G1 Y400 F2400
  {% endif %}

  # ─── X axis (after Y only) ───
  {% if home_all or 'X' in params %}
    G28 X
    G1 X380 F2400
  {% endif %}

  # ─── Z axis ───
  {% if home_all or 'Z' in params %}
    G0 X200 Y200 F6000
    G28 Z
    {% if z_was_homed %}
      SET_Z_FROM_PROBE METHOD=tap
    {% else %}
      SET_Z_FROM_PROBE METHOD=scan
    {% endif %}
  {% endif %}
