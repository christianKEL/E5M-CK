# E5M-CK nginx.conf
#
# Serves the Fluidd web UI on port 80 and proxies API/WebSocket traffic to
# Moonraker on 127.0.0.1:7125.
#
# Lives at: /opt/etc/nginx/nginx.conf (Entware default)
# Started by: /etc/init.d/S99znginx (which first frees port 80 by killing
#             Creality's stock web-server).

user root;
worker_processes 1;

# Entware nginx defaults to /opt/var/log/nginx/error.log — fine, but we
# also send a copy somewhere our log_main and verify.sh can find.
error_log /usr/data/printer_data/logs/nginx-error.log warn;
pid       /var/run/nginx-e5m.pid;

events {
    worker_connections 256;
}

http {
    include       /opt/etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Route nginx's temp files (request bodies during upload + proxy
    # response buffers) onto the 6 GB eMMC partition. Defaults point
    # at /opt/var/lib/nginx/{body,proxy}/ which lives on the small
    # overlay partition (~93 MB free) — large uploads run it out and
    # nginx returns 500 with pwrite() ENOSPC. The init script ensures
    # these dirs exist before starting nginx.
    client_body_temp_path /usr/data/nginx_tmp/body;
    proxy_temp_path       /usr/data/nginx_tmp/proxy 1 2;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Access log goes to /usr/data so it persists across overlay resets.
    access_log /usr/data/printer_data/logs/nginx-access.log;

    # Moonraker upstream. Single backend, plain HTTP.
    upstream moonraker {
        server 127.0.0.1:7125;
        keepalive 16;
    }

    # Webcam streaming would go here in a later phase.

    server {
        listen 80 default_server;
        server_name _;

        # Maximum upload. Big multi-hour prints can produce gcode files
        # >400 MB (e.g. high-detail multi-color slices). 1g gives plenty
        # of headroom — the actual disk limit is the 5 GB /usr/data
        # partition, enforced at upload-staging time by Moonraker's
        # TMPDIR -> /usr/data/mr_tmp (see S56moonraker_service).
        client_max_body_size 1g;

        # Increase timeouts so long-running endpoints don't drop.
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # ---- Fluidd static files ----
        root /usr/data/e5m-ck/fluidd;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---- Moonraker HTTP API ----
        location ~ ^/(server|access|api|machine|printer)/ {
            proxy_pass http://moonraker;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Scheme $scheme;
        }

        # ---- Moonraker WebSocket ----
        location /websocket {
            proxy_pass http://moonraker/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }
    }
}
