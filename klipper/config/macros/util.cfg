# General-purpose macros: PURGE_LINE, PARK, fan helpers, thermal-expansion comp.


# ═══════════════════════════════════════════════════════════════════════
# APPLY_HOTEND_THERMAL_OFFSET — compensate hotend thermal expansion
#
# Physical basis: the hotend assembly (heatbreak + heater block + nozzle)
# expands vertically when heated. For our E5M assembly the effective
# coefficient is empirically ~0.001333 mm/°C (= 22e-6/°C × ~60 mm
# thermal length).
#
# Why we need it: v2 START_PRINT calibrates Z=0 (FINAL_TAP_OFFSET) at
# 140 °C, before heating to print temp. At the final print temperature
# the nozzle tip is physically LOWER than at 140 °C by `delta × coef`,
# so the first layer would be over-crushed by exactly that amount.
# This macro applies a positive Z_ADJUST that lifts the nozzle back to
# the slicer's intended first-layer height.
#
# When NOT to call this macro:
#   ✗ Before FULL_CALIBRATE / FINAL_TAP_OFFSET (cooks the comp into Z=0)
#   ✗ Before BED_MESH_CALIBRATE                (offsets the mesh)
#   ✗ Before any tap/probe                     (biases the measurement)
#   ✗ More than once per print                 (Z_ADJUST is incremental)
#
# Empirical calibration on E5M-CK (2026-05-22): coef = 0.000375 mm/°C.
# Derived from: with coef=0.001 (Crocker E3D V6 reference, +0.08mm at
# delta=80°C) the first layer was 0.05mm too high — user needed -0.05
# babystep. So the real lift needed was 0.08 - 0.05 = 0.03mm → coef =
# 0.03 / 80 = 0.000375 mm/°C. About 3× lower than the V6 reference,
# consistent with the E5M nozzle assembly having a shorter effective
# thermal length than a V6 (probably ~20-25mm of expanding metal vs 60mm).
# ═══════════════════════════════════════════════════════════════════════
[gcode_macro APPLY_HOTEND_THERMAL_OFFSET]
description: Compensate hotend thermal expansion between cal temp and current temp.
variable_cal_temp: 140        # Temperature at which SET_Z_FROM_PROBE METHOD=tap runs in START_PRINT
variable_coef: 0.000375       # Expansion in mm per °C (empirical E5M-CK, 2026-05-22)
variable_min_offset: 0.0      # Skip if computed offset is below this
variable_max_offset: 0.20     # Safety cap on max offset

gcode:
    {% set self_vars = printer["gcode_macro APPLY_HOTEND_THERMAL_OFFSET"] %}
    {% set cal_temp = self_vars.cal_temp|float %}
    {% set coef = self_vars.coef|float %}
    {% set min_off = self_vars.min_offset|float %}
    {% set max_off = self_vars.max_offset|float %}

    {% set print_temp = printer.extruder.temperature|float %}
    {% set delta = print_temp - cal_temp %}
    {% set offset = delta * coef %}

    {% if offset < min_off %}
        RESPOND TYPE=command MSG="Hotend thermal offset: skipped (computed {'%.4f' % offset}mm < min_offset)"
    {% elif offset > max_off %}
        RESPOND TYPE=error MSG="Hotend thermal offset: capped at {'%.4f' % max_off}mm (computed {'%.4f' % offset}mm - check coef)"
        SET_GCODE_OFFSET Z_ADJUST={max_off} MOVE=1
    {% else %}
        SET_GCODE_OFFSET Z_ADJUST={offset} MOVE=1
        RESPOND TYPE=command MSG="Hotend thermal offset: +{'%.4f' % offset}mm (nozzle {'%.1f' % print_temp}C, delta {'%.1f' % delta}C from cal at {'%.0f' % cal_temp}C)"
    {% endif %}




[gcode_macro PURGE_LINE]
description: Print a 100 mm purge line along the front of the bed.
gcode:
    G90
    G1 X10 Y10 Z0.3 F6000
    G91
    M83
    G1 X100 E10 F1200            ; 100 mm line, 10 mm extrusion
    G1 X5  E-2 F2400             ; small retract
    G1 Z2  F600
    G90


[gcode_macro PARK]
description: Park the toolhead at the front of the bed without changing temps.
gcode:
    {% set Z_HOP = params.Z|default(10)|int %}
    G91
    G1 Z{Z_HOP} F600
    G90
    G1 X10 Y390 F6000


[gcode_macro M204]
# Override M204 so the slicer can set accel without using "max_accel_to_decel".
rename_existing: M204.1
gcode:
    {% if 'S' in params %}{% set S = params.S|float %}
      SET_VELOCITY_LIMIT ACCEL={S}
    {% endif %}


# ─── M106 / M107 — part-cooling fans with min-PWM scaling ─────────────
# The printer.cfg declares the two part-cooling fans as [output_pin fan0]
# and [output_pin fan1] (one front, one rear). Plain [fan] would auto-
# register M106/M107 but we'd lose the per-fan addressing — slicers
# expect a SINGLE fan to set with M106 Sxxx, while our hardware has two
# physical fans we want both driven from the same command.
#
# Without these macros the slicer's M106 spam aborts as
#   // Unknown command:"M106"
# and the print runs with zero part cooling — overhangs & bridges sag.
#
# Min-PWM scaling: each fan has a minimum PWM below which the motor
# energizes but doesn't spin (buzzes, no airflow). Empirical floors on
# our hardware (carried over from v1):
#   fan0 (front) — min 90/255  ≈ 35 % duty cycle
#   fan1 (rear)  — min 70/255  ≈ 27 % duty cycle
#
# The macro remaps the slicer's S∈[1..255] onto [min..255] linearly so
# every non-zero S commands a value above the spin threshold. Trade-off:
# a slicer "M106 S64" (25 %) ends up at ~51 % real duty, slight over-
# cooling at low settings — far better than a stalled fan.
[gcode_macro M106]
description: Fan ON with Creality min-PWM scaling (fan0_min=90, fan1_min=70).
gcode:
    {% set tmp = 255 %}
    {% if params.S is defined %}
        {% set tmp = params.S|int %}
        {% if tmp > 255 %}{% set tmp = 255 %}{% endif %}
    {% endif %}

    {% if tmp < 1 %}
        SET_PIN PIN=fan0 VALUE=0
        SET_PIN PIN=fan1 VALUE=0
    {% else %}
        {% set v1 = 70 + (255 - 70) * tmp / 255 %}
        {% if v1 > 255 %}{% set v1 = 255 %}{% endif %}
        SET_PIN PIN=fan1 VALUE={v1}

        {% set v0 = 90 + (255 - 90) * tmp / 255 %}
        {% if v0 > 255 %}{% set v0 = 255 %}{% endif %}
        SET_PIN PIN=fan0 VALUE={v0}
    {% endif %}

[gcode_macro M107]
description: Fan OFF (turns off both part fans).
gcode:
    SET_PIN PIN=fan0 VALUE=0
    SET_PIN PIN=fan1 VALUE=0


# ─── BED_Z_TILT — mechanical Z sync (Creality stock procedure) ──────
# Why this exists:
#   The Ender 5 Max has FOUR Z lead screws driven by ONE Z motor through
#   a single timing belt. Over time the belt can slip rotational phase
#   between screws, tilting the bed (one corner ends up higher than the
#   others). There is no per-screw stepper on this printer, so a
#   software [z_tilt] mesh-correct loop cannot fix it.
#
# What this does:
#   1. G28 — make sure XYZ are homed first.
#   2. G1 Z400 F300 — drive the bed almost to the bottom of its travel
#      (position_max=406.5; Z=400 leaves ~6 mm headroom).
#   3. 8× FORCE_MOVE STEPPER=stepper_z DISTANCE=+5 — push the stepper
#      another 40 units past the soft limit (FORCE_MOVE bypasses
#      kinematic bounds). The bed is already at its lower mechanical
#      stop, so the belt physically slips against the screws until all
#      four are seated equally on their hard stop — equalizing the
#      rotational phase of the four screws and untilting the bed.
#   4. FORCE_MOVE -200 — retract the bed 200 mm up off the stop.
#   5. G28 — re-establish kinematic position via the Eddy probe.
#
# Safety:
#   - Confirmed safe on this hardware: the 8× +5 grinding does NOT
#     damage the belt or screws — the belt simply slips quietly.
#     User-validated multiple times in production.
#   - Z=400 is the BOTTOM of bed travel (E5M is moving-bed CoreXY:
#     higher Z = bed further from toolhead, see docs/memos/z_kinematics.md).
#     No risk of toolhead-bed contact during this routine.
#
# When to run:
#   - First boot after un-/re-belting the Z drive system.
#   - Whenever a bed_mesh shows a consistent corner-to-corner slope that
#     wasn't there before (suggests one screw has slipped phase).
#   - As a routine before a critical first-layer print.

[gcode_macro BED_Z_TILT]
description: Mechanical bed Z tilt synchronization (Creality stock procedure)
gcode:
    RESPOND TYPE=command MSG="Starting mechanical Z synchronization..."
    G28 X Y Z
    # Two-phase descent: fast to 380 mm (max_z_velocity = 30 mm/s,
    # ~13 s), then slow the last 20 mm to approach the lower hard stop
    # without slamming. Klipper silently clamps F values to
    # max_z_velocity, so F1800 (=30 mm/s) is the actual ceiling.
    G1 Z380 F1800
    G1 Z400 F300
    FORCE_MOVE STEPPER=stepper_z DISTANCE=5 VELOCITY=5
    FORCE_MOVE STEPPER=stepper_z DISTANCE=5 VELOCITY=5
    FORCE_MOVE STEPPER=stepper_z DISTANCE=5 VELOCITY=5
    FORCE_MOVE STEPPER=stepper_z DISTANCE=5 VELOCITY=5
    FORCE_MOVE STEPPER=stepper_z DISTANCE=5 VELOCITY=5
    FORCE_MOVE STEPPER=stepper_z DISTANCE=5 VELOCITY=5
    FORCE_MOVE STEPPER=stepper_z DISTANCE=5 VELOCITY=5
    FORCE_MOVE STEPPER=stepper_z DISTANCE=5 VELOCITY=5
    FORCE_MOVE STEPPER=stepper_z DISTANCE=-200 VELOCITY=5
    RESPOND TYPE=command MSG="Mechanical Z sync complete"
    G28


# ─── CAL_BED_MESH — quick 15x15 rapid-scan bed mesh ─────────────────
# Wraps BED_MESH_CALIBRATE in rapid_scan mode (the only sane mode for
# Eddy-based meshing — the default per-point method would try to PROBE
# at descend_z=2.5 at each of the 225 points, taking forever).
#
# - Skips G28 if already homed (saves ~30 s when chaining after another
#   macro that already established Z).
# - BED_MESH_CLEAR before the scan: applying an old mesh while measuring
#   a new one would bias the new readings by the old correction.
# - PROBE_COUNT=15,15 is explicit (matches the [bed_mesh] config default).
# - Does NOT auto-SAVE_CONFIG — user reviews the mesh first (Fluidd's
#   heightmap view), then SAVE_CONFIG if it looks good.

[gcode_macro CAL_BED_MESH]
description: Quick bed mesh scan (15x15 rapid_scan)
gcode:
    RESPOND TYPE=command MSG="Quick bed mesh scan starting..."
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE METHOD=rapid_scan PROBE_COUNT=15,15
    RESPOND TYPE=command MSG="Quick mesh complete - Run SAVE_CONFIG if needed"
