# ═══════════════════════════════════════════════════════════════════════
# INPUT_SHAPER macros — user-facing wrappers for resonance testing.
#
# Flow:
#   MEASURE_AXIS AXIS=X   -> SHAPER_CALIBRATE on X (auto-suggests shaper,
#                            writes to autosave). Optional PNG via
#                            SHAPER_PNG AXIS=X afterwards.
#   MEASURE_AXIS AXIS=Y   -> same for Y.
#   MEASURE_BELTS         -> two ±45° sweeps for CoreXY belt comparison
#                            (raw CSVs + Klippain graph_belts.py PNG).
#   SHAPER_PNG AXIS=X|Y   -> regenerate a per-axis PNG from the most
#                            recent CSV (Klipper's calibrate_shaper.py).
#
# Output PNG dir: /usr/data/printer_data/config/printer_calibration_graphs/
# (visible in Fluidd's Configuration tab → printer_calibration_graphs/).
#
# Light: light_pin is forced ON at the start of every macro so the user
# can watch the toolhead during the sweep (per the team rule).
# ═══════════════════════════════════════════════════════════════════════


# Shell-command wrappers. The .sh helpers live in /usr/data/e5m-ck/bin/
# and are installed by installs/install_input_shaper.sh.

[gcode_shell_command e5m_gen_shaper_png]
command: /usr/data/e5m-ck/bin/gen_shaper_png.sh
timeout: 90.0
verbose: True

[gcode_shell_command e5m_gen_belts_png]
command: /usr/data/e5m-ck/bin/gen_belts_png.sh
timeout: 90.0
verbose: True


# ─── MEASURE_AXIS — single-axis resonance + auto shaper suggestion ──
# Uses Klipper master's SHAPER_CALIBRATE (sweep + analysis + auto-write
# to autosave in one shot — added post-v0.13.0). Simpler than
# TEST_RESONANCES → manual CSV → manual PNG → manual edit.
#
# After both axes: SAVE_CONFIG to persist + sync values back to the repo
# (see docs/operations/input_shaper.md).
[gcode_macro MEASURE_AXIS]
description: Sweep one axis with the accelerometer and auto-suggest a shaper.
gcode:
    {% set axis = params.AXIS|default('X')|upper %}
    {% if axis not in ['X', 'Y'] %}
        {action_raise_error("MEASURE_AXIS AXIS must be X or Y, got " ~ axis)}
    {% endif %}
    SET_PIN PIN=light_pin VALUE=1
    RESPOND TYPE=command MSG="MEASURE_AXIS {axis}: homing + center..."
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X200 Y200 Z10 F6000
    RESPOND TYPE=command MSG="MEASURE_AXIS {axis}: sweep + analysis (~45 s)..."
    SHAPER_CALIBRATE AXIS={axis}
    RESPOND TYPE=command MSG="MEASURE_AXIS {axis}: done. SAVE_CONFIG to persist; SHAPER_PNG AXIS={axis|lower} for a visual."


# ─── SHAPER_PNG — generate visual PNG from the most recent CSV ──────
# SHAPER_CALIBRATE writes the recommended values to autosave directly,
# so a PNG isn't strictly needed for the main flow — but it's useful
# for inspection (peak height, recommendation confidence).
#
# The CSV path is auto-derived from the AXIS arg using Klipper's
# default naming: /tmp/calibration_data_<axis>_<timestamp>.csv. Klipper
# also creates /tmp/resonances_<axis>.csv for the last run regardless
# of name; we use the simpler form.
[gcode_macro SHAPER_PNG]
description: Regenerate PNG from the latest TEST_RESONANCES/SHAPER_CALIBRATE CSV.
gcode:
    {% set axis = params.AXIS|default('x')|lower %}
    {% if axis not in ['x', 'y'] %}
        {action_raise_error("SHAPER_PNG AXIS must be x or y, got " ~ axis)}
    {% endif %}
    RESPOND TYPE=command MSG="SHAPER_PNG {axis}: generating PNG..."
    RUN_SHELL_COMMAND CMD=e5m_gen_shaper_png PARAMS="{axis}"


# ─── MEASURE_BELTS — CoreXY ±45° belt tension comparison ────────────
# Drives the toolhead diagonally along the A belt (1,1,0) and B belt
# (1,-1,0). Healthy belts produce nearly overlapping FFT spectra. A
# clear separation means one belt is significantly slacker / tighter.
[gcode_macro MEASURE_BELTS]
description: CoreXY belt tension comparison via accel + PNG overlay.
gcode:
    SET_PIN PIN=light_pin VALUE=1
    RESPOND TYPE=command MSG="MEASURE_BELTS: homing + center..."
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X200 Y200 Z10 F6000
    RESPOND TYPE=command MSG="MEASURE_BELTS: A-belt sweep..."
    TEST_RESONANCES AXIS=1,1 OUTPUT=raw_data NAME=e5m_belt_a
    RESPOND TYPE=command MSG="MEASURE_BELTS: B-belt sweep..."
    TEST_RESONANCES AXIS=1,-1 OUTPUT=raw_data NAME=e5m_belt_b
    RESPOND TYPE=command MSG="MEASURE_BELTS: generating PNG..."
    RUN_SHELL_COMMAND CMD=e5m_gen_belts_png
    RESPOND TYPE=command MSG="MEASURE_BELTS: done. PNG in printer_calibration_graphs/"
