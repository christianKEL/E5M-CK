# ═══════════════════════════════════════════════════════════════════════
# INPUT_SHAPER macros — user-facing wrappers for resonance testing.
#
# Flow:
#   MEASURE_AXIS AXIS=X   -> SHAPER_CALIBRATE on X (auto-suggests shaper,
#                            writes to autosave). Optional PNG via
#                            SHAPER_PNG AXIS=X afterwards.
#   MEASURE_AXIS AXIS=Y   -> same for Y.
#   MEASURE_BELTS         -> two ±45° sweeps for CoreXY belt comparison
#                            (raw CSVs + Klippain graph_belts.py PNG).
#   SHAPER_PNG AXIS=X|Y   -> regenerate a per-axis PNG from the most
#                            recent CSV (Klipper's calibrate_shaper.py).
#
# Output PNG dir: /usr/data/printer_data/config/printer_calibration_graphs/
# (visible in Fluidd's Configuration tab → printer_calibration_graphs/).
#
# Light: light_pin is forced ON at the start of every macro so the user
# can watch the toolhead during the sweep (per the team rule).
# ═══════════════════════════════════════════════════════════════════════


# Shell-command wrappers. The .sh helpers live in /usr/data/e5m-ck/bin/
# and are installed by installs/install_input_shaper.sh.

[gcode_shell_command e5m_gen_belts_png]
command: /usr/data/e5m-ck/bin/gen_belts_png.sh
timeout: 90.0
verbose: True

# Bound to GuppyScreen's "Input Shaper" UI button. The binary sends:
#   RUN_SHELL_COMMAND CMD=guppy_input_shaper PARAMS="<csv> -o <png> -w 4.8 -l 2.72"
# after running TEST_RESONANCES AXIS=X NAME=x then AXIS=Y NAME=y itself.
# Our wrapper forwards the args verbatim to scripts/calibrate_shaper.py.
[gcode_shell_command guppy_input_shaper]
command: /usr/data/e5m-ck/bin/gen_shaper_for_guppy.sh
timeout: 120.0
verbose: True


# ─── MEASURE_AXIS — single-axis resonance + auto MZV calibration ────
# Uses TEST_RESONANCES (lower-level Klipper command) + the same
# guppy_input_shaper shell command that GuppyScreen's UI button calls.
# Doing the EXACT same thing both UIs do guarantees identical results.
#
# Why not SHAPER_CALIBRATE here: SHAPER_CALIBRATE auto-picks among all
# shapers (zv, mzv, ei, 2hump_ei, 3hump_ei) which gives different
# winners on different measurements. We want MZV always (machine is
# tuned for it), so we let guppy_input_shaper enforce --shapers=mzv.
#
# Final state after MEASURE_AXIS X+Y:
#   - /usr/data/printer_data/config/resonances_<axis>.png  (480x272 small)
#   - /usr/data/printer_data/config/printer_calibration_graphs/resonances_<axis>.png  (8x4.8 large)
#   - [input_shaper] staged in autosave (MZV with the freq just measured)
#   - [printer] max_accel rewritten in printer.cfg to min(x, y) cap
# User then runs SAVE_CONFIG to persist [input_shaper].
[gcode_macro MEASURE_AXIS]
description: Sweep one axis with the accelerometer and auto-apply MZV shaper.
gcode:
    {% set axis = params.AXIS|default('X')|upper %}
    {% set ax_lo = axis|lower %}
    {% if axis not in ['X', 'Y'] %}
        {action_raise_error("MEASURE_AXIS AXIS must be X or Y, got " ~ axis)}
    {% endif %}
    SET_PIN PIN=light_pin VALUE=1
    RESPOND TYPE=command MSG="MEASURE_AXIS {axis}: homing + center..."
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X200 Y200 Z10 F6000
    RESPOND TYPE=command MSG="MEASURE_AXIS {axis}: sweep (~45 s)..."
    TEST_RESONANCES AXIS={axis} NAME={ax_lo}
    RESPOND TYPE=command MSG="MEASURE_AXIS {axis}: generating PNGs (small + large, MZV)..."
    RUN_SHELL_COMMAND CMD=guppy_input_shaper PARAMS="/tmp/resonances_{ax_lo}_{ax_lo}.csv -o /usr/data/printer_data/config/resonances_{ax_lo}.png -w 4.8 -l 2.72"
    RESPOND TYPE=command MSG="MEASURE_AXIS {axis}: done."


# ─── SHAPER_PNG — regenerate the two PNGs for an axis from the latest CSV ─
# Same wrapper as MEASURE_AXIS (and GuppyScreen) — no toolhead motion,
# just re-renders the existing /tmp/resonances_<axis>_<axis>.csv into
# the canonical small + large PNG paths with --shapers=mzv enforced.
# Useful for re-rendering after editing graph styling or for previewing
# without re-sweeping. /tmp/ is tmpfs so the CSV is gone after a reboot.
[gcode_macro SHAPER_PNG]
description: Re-render shaper PNGs from the latest TEST_RESONANCES CSV (no sweep).
gcode:
    {% set axis = params.AXIS|default('x')|lower %}
    {% if axis not in ['x', 'y'] %}
        {action_raise_error("SHAPER_PNG AXIS must be x or y, got " ~ axis)}
    {% endif %}
    RESPOND TYPE=command MSG="SHAPER_PNG {axis}: generating PNGs (small + large, MZV)..."
    RUN_SHELL_COMMAND CMD=guppy_input_shaper PARAMS="/tmp/resonances_{axis}_{axis}.csv -o /usr/data/printer_data/config/resonances_{axis}.png -w 4.8 -l 2.72"


# ─── MEASURE_BELTS — CoreXY ±45° belt tension comparison ────────────
# Drives the toolhead diagonally along the A belt (1,1,0) and B belt
# (1,-1,0). Healthy belts produce nearly overlapping FFT spectra. A
# clear separation means one belt is significantly slacker / tighter.
[gcode_macro MEASURE_BELTS]
description: CoreXY belt tension comparison via accel + PNG overlay.
gcode:
    SET_PIN PIN=light_pin VALUE=1
    RESPOND TYPE=command MSG="MEASURE_BELTS: homing + center..."
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X200 Y200 Z10 F6000
    RESPOND TYPE=command MSG="MEASURE_BELTS: A-belt sweep..."
    TEST_RESONANCES AXIS=1,1 OUTPUT=raw_data NAME=e5m_belt_a
    RESPOND TYPE=command MSG="MEASURE_BELTS: B-belt sweep..."
    TEST_RESONANCES AXIS=1,-1 OUTPUT=raw_data NAME=e5m_belt_b
    RESPOND TYPE=command MSG="MEASURE_BELTS: generating PNG..."
    RUN_SHELL_COMMAND CMD=e5m_gen_belts_png
    RESPOND TYPE=command MSG="MEASURE_BELTS: done. PNG in printer_calibration_graphs/"
