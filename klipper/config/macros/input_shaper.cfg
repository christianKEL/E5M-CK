# ═══════════════════════════════════════════════════════════════════════
# INPUT_SHAPER macros — user-facing wrappers for resonance testing.
#
# Flow:
#   MEASURE_AXIS AXIS=X   -> SHAPER_CALIBRATE on X (auto-suggests shaper,
#                            writes to autosave). Optional PNG via
#                            SHAPER_PNG AXIS=X afterwards.
#   MEASURE_AXIS AXIS=Y   -> same for Y.
#   MEASURE_BELTS         -> two ±45° sweeps for CoreXY belt comparison
#                            (raw CSVs + Klippain graph_belts.py PNG).
#   SHAPER_PNG AXIS=X|Y   -> regenerate a per-axis PNG from the most
#                            recent CSV (Klipper's calibrate_shaper.py).
#
# Output PNG dir: /usr/data/printer_data/config/printer_calibration_graphs/
# (visible in Fluidd's Configuration tab → printer_calibration_graphs/).
#
# Light: light_pin is forced ON at the start of every macro so the user
# can watch the toolhead during the sweep (per the team rule).
# ═══════════════════════════════════════════════════════════════════════


# Shell-command wrappers. The .sh helpers live in /usr/data/e5m-ck/bin/
# and are installed by installs/install_input_shaper.sh.

# Bound to GuppyScreen's "Input Shaper" UI button. The binary sends:
#   RUN_SHELL_COMMAND CMD=guppy_input_shaper PARAMS="<csv> -o <png> -w 4.8 -l 2.72"
# after running TEST_RESONANCES AXIS=X NAME=x then AXIS=Y NAME=y itself.
# The wrapper produces both PNG sizes + emits JSON for GuppyScreen.
#
# Timeout: 240s. The wrapper does 3 matplotlib-backed Python invocations
# per axis (small PNG, large PNG, JSON re-fit) and matplotlib startup
# alone is ~10s on this MIPS host. Empirically a single axis run takes
# 75-100s; 120s left too little headroom and was cutting some runs off
# before JSON emission, leaving GuppyScreen's display widget blank.
[gcode_shell_command guppy_input_shaper]
command: /usr/data/e5m-ck/bin/gen_shaper_for_guppy.sh
timeout: 240.0
verbose: True

# Bound to GuppyScreen's "Belts/Shake" UI button. Called by our
# GUPPY_BELTS_SHAPER_CALIBRATION macro (defined below), which itself
# runs the two TEST_RESONANCES sweeps first. The wrapper auto-picks
# the latest /tmp/raw_data_axis*_e5m_belt_{a,b}.csv pair, generates
# both PNGs (small at GuppyScreen-requested path, full at
# printer_calibration_graphs/belts_full.png).
#
# Timeout: 600s. Belt CSVs are 21 MB raw accel data each. parse_log()
# + compute_signal_data() (FFT) dominates the runtime; even with the
# single-pass belts_full.py optimization it can take 4-5 min on MIPS.
[gcode_shell_command guppy_belts_calibration]
command: /usr/data/e5m-ck/bin/gen_belts_for_guppy.sh
timeout: 600.0
verbose: True


# Called by GuppyScreen's "Save" button after Input Shaper completes.
# The binary emits (verified in inputshaper_panel.cpp line 340-346):
#   SAVE_INPUT_SHAPER SHAPER_FREQ_X={} SHAPER_TYPE_X={} \
#                     SHAPER_FREQ_Y={} SHAPER_TYPE_Y={}
#   SAVE_CONFIG                          ← appended by GuppyScreen
# with the values it parsed from our JSON output. Since the JSON
# already had "best": "mzv" (project policy), SHAPER_TYPE_X/Y are
# both "mzv" and SHAPER_FREQ_X/Y are the MZV-fitted frequencies.
#
# We don't trust those params — instead we re-run APPLY_SHAPER_MAX_ACCEL
# (idempotent: same CSVs, same MZV refit, same numbers, re-stages
# [input_shaper] in memory and rewrites [printer] max_accel in
# printer.cfg in place).
#
# We do NOT call SAVE_CONFIG here — GuppyScreen appends it itself
# after this macro. Calling SAVE_CONFIG twice triggers two Klipper
# restarts and two timestamped backup files. The in-place max_accel
# rewrite done by APPLY survives SAVE_CONFIG (SAVE_CONFIG reads
# from disk fresh before writing).
[gcode_macro SAVE_INPUT_SHAPER]
description: GuppyScreen Input Shaper "Save" button binding.
gcode:
    RESPOND TYPE=command MSG="SAVE_INPUT_SHAPER: re-staging MZV..."
    APPLY_SHAPER_MAX_ACCEL


# ─── MEASURE_AXIS — single-axis resonance + auto MZV calibration ────
# Uses TEST_RESONANCES (lower-level Klipper command) + the same
# guppy_input_shaper shell command that GuppyScreen's UI button calls,
# so the two UIs produce identical numbers and PNGs.
#
# The PNGs show ALL 5 candidate shapers (zv, mzv, ei, 2hump_ei,
# 3hump_ei) so the user can visually compare them — that's Klipper's
# stock visualization. What gets PERSISTED via SAVE_CONFIG is forced
# to MZV by APPLY_SHAPER_MAX_ACCEL (machine is tuned for MZV).
#
# Final state after MEASURE_AXIS X+Y:
#   - printer_calibration_graphs/resonance_<axis>_guppy_screen.png   (small, 480x272)
#   - printer_calibration_graphs/resonance_<axis>_full.png            (large, 8x4.8 in)
#   - config/resonances_<axis>.png -> ...guppy_screen.png   (symlink for GuppyScreen)
#   - [input_shaper] staged in autosave (MZV with the MZV-fitted freq)
#   - [printer] max_accel rewritten in printer.cfg to min(x, y) cap
# User then runs SAVE_CONFIG to persist [input_shaper].
[gcode_macro MEASURE_AXIS]
description: Sweep one axis with the accelerometer and auto-apply MZV shaper.
gcode:
    {% set axis = params.AXIS|default('X')|upper %}
    {% set ax_lo = axis|lower %}
    {% if axis not in ['X', 'Y'] %}
        {action_raise_error("MEASURE_AXIS AXIS must be X or Y, got " ~ axis)}
    {% endif %}
    SET_PIN PIN=light_pin VALUE=1
    RESPOND TYPE=command MSG="MEASURE_AXIS {axis}: homing + center..."
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X200 Y200 Z10 F6000
    RESPOND TYPE=command MSG="MEASURE_AXIS {axis}: sweep (~45 s)..."
    TEST_RESONANCES AXIS={axis} NAME={ax_lo}
    RESPOND TYPE=command MSG="MEASURE_AXIS {axis}: generating PNGs (small + large, MZV)..."
    RUN_SHELL_COMMAND CMD=guppy_input_shaper PARAMS="/tmp/resonances_{ax_lo}_{ax_lo}.csv -o /usr/data/printer_data/config/resonances_{ax_lo}.png -w 4.8 -l 2.72"
    RESPOND TYPE=command MSG="MEASURE_AXIS {axis}: done."


# ─── SHAPER_PNG — regenerate the two PNGs for an axis from the latest CSV ─
# Same wrapper as MEASURE_AXIS (and GuppyScreen) — no toolhead motion,
# just re-renders the existing /tmp/resonances_<axis>_<axis>.csv into
# the canonical small + large PNG paths with --shapers=mzv enforced.
# Useful for re-rendering after editing graph styling or for previewing
# without re-sweeping. /tmp/ is tmpfs so the CSV is gone after a reboot.
[gcode_macro SHAPER_PNG]
description: Re-render shaper PNGs from the latest TEST_RESONANCES CSV (no sweep).
gcode:
    {% set axis = params.AXIS|default('x')|lower %}
    {% if axis not in ['x', 'y'] %}
        {action_raise_error("SHAPER_PNG AXIS must be x or y, got " ~ axis)}
    {% endif %}
    RESPOND TYPE=command MSG="SHAPER_PNG {axis}: generating PNGs (small + large, MZV)..."
    RUN_SHELL_COMMAND CMD=guppy_input_shaper PARAMS="/tmp/resonances_{axis}_{axis}.csv -o /usr/data/printer_data/config/resonances_{axis}.png -w 4.8 -l 2.72"


# ─── GUPPY_BELTS_SHAPER_CALIBRATION — CoreXY belt tension comparison ─
# This is the macro name GuppyScreen's "Belts/Shake" button sends
# (verified via `strings` on the binary). Fluidd's MEASURE_BELTS alias
# below calls into the same macro so both UIs run identical protocol.
#
# Drives the toolhead diagonally along the A belt (1,1,0) and B belt
# (1,-1,0). Healthy belts produce nearly overlapping FFT spectra; a
# clear separation means one belt is slacker/tighter than the other.
#
# Params accepted (with defaults — GuppyScreen passes its own values):
#   PNG_OUT_PATH — small-PNG output path GuppyScreen polls for display.
#                  Default: /usr/data/printer_data/config/belts_calibration.png
#                  (becomes a symlink to printer_calibration_graphs/belts_guppy_screen.png)
#   PNG_WIDTH    — small PNG width in inches. Default 4.8 (Nebula Pad width).
#   PNG_HEIGHT   — small PNG height in inches. Default 2.72 (Nebula Pad height).
#
# Final state:
#   - printer_calibration_graphs/belts_guppy_screen.png   (small, 480x272)
#   - printer_calibration_graphs/belts_full.png            (large, 8x4.8 in)
#   - config/belts_calibration.png -> ...belts_guppy_screen.png   (symlink)
[gcode_macro GUPPY_BELTS_SHAPER_CALIBRATION]
description: CoreXY belt tension comparison (called by GuppyScreen Belts button).
gcode:
    {% set png_out = params.PNG_OUT_PATH|default('/usr/data/printer_data/config/belts_calibration.png') %}
    {% set png_w = params.PNG_WIDTH|default(4.8)|float %}
    {% set png_h = params.PNG_HEIGHT|default(2.72)|float %}
    SET_PIN PIN=light_pin VALUE=1
    RESPOND TYPE=command MSG="BELTS: homing + center..."
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X200 Y200 Z10 F6000
    # NAME assignment maps physical belts → legend labels:
    #   A = AXIS=1, 1 (stepper_x alone) → "X belt" in the graph legend
    #   B = AXIS=1,-1 (stepper_y alone) → "Y belt"
    #
    # Per Klipper CoreXY kinematics (klippy/kinematics/corexy.py),
    # stepper_x drives A = ΔX + ΔY and stepper_y drives B = ΔX - ΔY.
    # So a (1, 1) excitation has ΔA=2, ΔB=0 ⇒ stepper_x alone moves,
    # and a (1,-1) excitation has ΔA=0, ΔB=2 ⇒ stepper_y alone moves.
    #
    # Empirically verified on the E5M with FORCE_MOVE STEPPER=stepper_x:
    # the physical X belt is the one that visibly moved, so stepper_x's
    # belt IS the X belt by name. graph_belts.py is patched to render
    # the A/B extracted from the filename suffix as "X belt" / "Y belt".
    #
    # (The v1 memo §7.3 had the AXIS assignments swapped; that was
    # specific to a different motor wiring or got noted incorrectly.
    # The mapping above is the one that actually matches the math
    # AND the FORCE_MOVE test on this printer.)
    RESPOND TYPE=command MSG="BELTS: A sweep (X belt, AXIS=1, 1)..."
    TEST_RESONANCES AXIS=1,1 OUTPUT=raw_data NAME=e5m_belt_a
    RESPOND TYPE=command MSG="BELTS: B sweep (Y belt, AXIS=1,-1)..."
    TEST_RESONANCES AXIS=1,-1 OUTPUT=raw_data NAME=e5m_belt_b
    RESPOND TYPE=command MSG="BELTS: generating PNGs (small + full)..."
    RUN_SHELL_COMMAND CMD=guppy_belts_calibration PARAMS="-o {png_out} -w {png_w} -l {png_h}"
    RESPOND TYPE=command MSG="BELTS: done. PNGs in printer_calibration_graphs/."


# Fluidd-friendly alias. Same protocol, same outputs.
[gcode_macro MEASURE_BELTS]
description: CoreXY belt tension comparison — alias for GUPPY_BELTS_SHAPER_CALIBRATION.
gcode:
    GUPPY_BELTS_SHAPER_CALIBRATION


# ─── GUPPY_EXCITATE_AXIS_AT_FREQ — sustained single-frequency vibration ─
# Called by the "Excitate" slider on GuppyScreen's Belts/Shake panel
# (verified in belts_calibration_panel.cpp lines 143-151). The binary
# sends a fixed-format gcode line each time the user releases the slider:
#   GUPPY_EXCITATE_AXIS_AT_FREQ FREQUENCY=<hz> AXIS=<x|y|a|b>
# where frequency = slider/10 + 1 (slider 0-1000 → 1-101 Hz typical).
#
# Purpose: hold the toolhead oscillating at one frequency long enough
# for the operator to put a hand on the gantry / belt / bed and feel
# which part resonates. Diagnostic only — no CSV is processed.
#
# Klipper TEST_RESONANCES doesn't have a "hold-single-frequency" mode,
# but a narrow band (1 Hz wide, default HZ_PER_SEC=1) gets close
# enough — about 2 s of oscillation around the requested frequency.
# OUTPUT=raw_data is the cheapest choice (no PSD compute). The CSV
# lands in /tmp/ and is harmless to leave (tmpfs, ~few KB).
#
# AXIS mapping (matches GUPPY_BELTS_SHAPER_CALIBRATION's convention):
#   x → AXIS=X  (full X-axis excitation; both steppers active)
#   y → AXIS=Y  (full Y-axis excitation; both steppers active)
#   a → AXIS=1,1   (stepper_x alone — X belt isolation)
#   b → AXIS=1,-1  (stepper_y alone — Y belt isolation)
[gcode_macro GUPPY_EXCITATE_AXIS_AT_FREQ]
description: Maintain a sustained excitation at one frequency on a chosen axis.
gcode:
    {% set freq = params.FREQUENCY|default(25)|int %}
    {% set axis = params.AXIS|default("x")|string|lower %}
    {% if axis == "a" %}
        {% set ax = "1,1" %}
        {% set label = "A belt (X)" %}
    {% elif axis == "b" %}
        {% set ax = "1,-1" %}
        {% set label = "B belt (Y)" %}
    {% elif axis == "x" %}
        {% set ax = "X" %}
        {% set label = "X axis" %}
    {% elif axis == "y" %}
        {% set ax = "Y" %}
        {% set label = "Y axis" %}
    {% else %}
        {action_raise_error("GUPPY_EXCITATE_AXIS_AT_FREQ: unknown AXIS=" ~ axis ~
                            " (expected x, y, a, or b)")}
    {% endif %}
    SET_PIN PIN=light_pin VALUE=1
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X200 Y200 Z10 F6000
    RESPOND TYPE=command MSG="EXCITATE {label} @ {freq} Hz..."
    TEST_RESONANCES AXIS={ax} OUTPUT=raw_data NAME=e5m_excitate FREQ_START={freq - 1} FREQ_END={freq + 1}
