# ═══════════════════════════════════════════════════════════════════════
# Print lifecycle macros — START_PRINT / END_PRINT / CANCEL_PRINT
# plus the nozzle-cleaning + Z-precision + prime-line helpers that
# START_PRINT chains together.
#
# Slicer contract: slicer's start G-code calls
#   START_PRINT BED_TEMP=<n> EXTRUDER_TEMP=<n>
# and end G-code calls END_PRINT.
#
# Differences vs v1:
#   - EDDY_RESET_TO_CONFIG dropped — our v2 baked everything into config
#     (drive_current, freq table, tap_threshold, drift_calibration).
#     Nothing drifts at runtime that needs explicit reset.
#   - FULL_CALIBRATE dropped — it called custom-fork commands not in
#     Klipper master, and v1 had to recalibrate the Eddy table at every
#     print because no drift compensation existed. v2 has drift comp
#     enabled (auto-loaded from config on each Klipper start).
#   - Added PRECISE_HOME step (homing.cfg) just before BED_MESH_CALIBRATE
#     so the mesh builds on a tap-precision Z=0 reference (~±5 µm)
#     instead of the scan-based ~±50 µm.
#   - FINAL_TAP_OFFSET ported as-is — only uses standard Klipper master
#     commands (PROBE METHOD=tap, SET_GCODE_OFFSET).
#   - NOZZLE_CLEAR_ON_BRUSH / NOZZLE_CLEAR_AT_PRINT_TEMP / PRIME_LINE
#     ported verbatim from v1 (hardware-dependent: silicone brush at
#     X=-3 Y=50-80, off-bed purge at X=-1 Y=120).
# ═══════════════════════════════════════════════════════════════════════


# ─── START_PRINT ───────────────────────────────────────────────────
[gcode_macro START_PRINT]
description: Full start sequence — heat, soak, home, clean, mesh, tap-refine, prime.
gcode:
    {% set bed_temp      = params.BED_TEMP|default(60)|int %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(220)|int %}
    {% set soak_time     = params.SOAK_TIME|default(300)|int %}
    {% set threshold     = params.THRESHOLD|default(5)|float %}

    # ─── State reset ─────────────────────────────────────────
    SET_GCODE_OFFSET Z=0
    BED_MESH_CLEAR
    G92 E0
    M220 S100
    M221 S100

    # ─── Abort early if no filament ──────────────────────────
    {% if not printer["filament_switch_sensor filament_sensor"].filament_detected %}
        {action_raise_error("START_PRINT aborted: no filament detected")}
    {% endif %}

    # ─── Heat bed with conditional soak ──────────────────────
    # Skip the soak penalty when chaining prints on an already-warm bed.
    {% set current = printer.heater_bed.temperature|float %}
    {% set delta   = bed_temp - current %}
    RESPOND TYPE=command MSG="Bed: current={'%.1f' % current}C target={'%.1f' % bed_temp}C delta={'%.1f' % delta}C"
    M140 S{bed_temp}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp}
    {% if delta >= threshold %}
        RESPOND TYPE=command MSG="Heat soak {(soak_time / 60)|int} min (delta >= {threshold}C)"
        G4 P{soak_time * 1000}
    {% else %}
        RESPOND TYPE=command MSG="Heat soak skipped (delta < {threshold}C)"
    {% endif %}

    # ─── Warm nozzle for tap-capable operations, then home ───
    RESPOND TYPE=command MSG="Heating nozzle to 140C for homing/tap"
    M104 S140
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=140
    RESPOND TYPE=command MSG="Homing"
    G28

    # ─── Nozzle cleaning (cycles 180 -> 140, retract -2 mm internally) ──
    RESPOND TYPE=command MSG="Nozzle cleaning on brush"
    NOZZLE_CLEAR_ON_BRUSH

    # NOZZLE_CLEAR_ON_BRUSH ends with M104 S0; bring the nozzle back to
    # 140 C for the mesh that follows. M104+TEMPERATURE_WAIT (no PID
    # settle wait) — the mesh accuracy depends on the coil-temp drift
    # comp, not on whether the nozzle is exactly at 140 vs 142.
    M104 S140
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=140

    # ─── Tap-precision Z=0 BEFORE mesh (at 140 C, no ooze) ──────
    # SET_Z_FROM_PROBE METHOD=tap = the Klipper Eddy_Probe.md canonical
    # pattern: PROBE METHOD=tap then SET_KINEMATIC_POSITION
    # Z={current_Z - last_probe_position.z} (shifts the kinematic
    # frame so Z=0 corresponds to actual tap-detected contact, ~±5 µm
    # instead of the scan-based G28's ~±50 µm).
    #
    # An earlier attempt failed during BED_MESH with "sensor not in
    # valid range" — kinematic shift of ~10 µm narrowed the safe
    # window for the freq-table lookup, and a bed point hit the
    # boundary. We're re-testing per operator request: at 140 C
    # there's no ooze, so if it works the mesh references a
    # tap-precision Z=0 natively without needing FINAL_TAP_OFFSET
    # afterward.
    #
    # If the mesh crashes again, revert to FINAL_TAP_OFFSET-based
    # approach (gcode_offset, no kinematic shift).
    RESPOND TYPE=command MSG="Tap-refining Z=0 at mesh temperature (140 C)"
    G90
    G1 X200 Y200 F6000
    G1 Z5 F600
    SET_Z_FROM_PROBE METHOD=tap
    G91
    G1 Z5 F600
    G90

    # ─── Bed mesh ────────────────────────────────────────────
    # rapid_scan exploits the Eddy probe's continuous-readout mode;
    # the drift compensation table loaded at boot keeps the readings
    # accurate across coil-temperature variations during the scan.
    RESPOND TYPE=command MSG="Bed mesh calibrating"
    BED_MESH_CALIBRATE METHOD=rapid_scan

    # ─── Position at prime line start, THEN heat to print_temp ──
    # No more NOZZLE_CLEAR_AT_PRINT_TEMP — NCB's 22 brushing passes plus
    # the non-contact bed_mesh interlude leave the nozzle clean enough
    # without a second print-temp brush.
    #
    # We position at the prime line start BEFORE the 140 -> print_temp
    # ramp so any ooze drips on the off-strip area (X=-1 Y=120), not on
    # the printable bed. Z=5 gives clearance from the bed during the
    # ~30 s ramp.
    G90
    G1 X-1.0 Y120 Z5 F6000

    RESPOND TYPE=command MSG="Heating to print_temp ({extruder_temp}C) at prime position"
    M104 S{extruder_temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp}

    # ─── Compensate hotend thermal expansion ────────────────────
    # SET_Z_FROM_PROBE tap-set Z=0 at 140 C. The hotend is now at
    # {extruder_temp} C; thermal expansion makes the physical nozzle
    # tip lower at print_temp than at 140 C by coef × delta.
    # APPLY_HOTEND_THERMAL_OFFSET lifts it via SET_GCODE_OFFSET Z_ADJUST.
    APPLY_HOTEND_THERMAL_OFFSET

    # ─── Prime line + start print ───────────────────────────────
    PRIME_LINE
    SET_PIN PIN=light_pin VALUE=1
    RESPOND TYPE=command MSG="Printing"


# ─── END_PRINT ─────────────────────────────────────────────────────
# Presents the print: heaters off, retract, drop bed to bottom so the
# part is accessible, park toolhead at back-right out of the way.
# Same geometry as CANCEL_PRINT (shares present_* in _PAUSE_RESUME_VARIABLES).
[gcode_macro END_PRINT]
description: Post-print — retract, present print (bed down + park back-right), motors off.
gcode:
    {% set v = printer["gcode_macro _PAUSE_RESUME_VARIABLES"] %}
    M400                           ; finish all moves
    M104 S0                        ; hotend off
    M140 S0                        ; bed off
    G91
    G1 E-2 F2700                   ; small retract
    G90
    # Present: drop bed all the way down (E5M moving-bed: Z+ = bed DOWN).
    G1 Z{v.present_z_drop} F{v.speed_park_z}
    # Park toolhead at back-right so the print is clear of obstructions.
    G1 X{v.present_x} Y{v.present_y} F{v.speed_park_xy}
    M84                            ; disable motors


# ─── CANCEL_PRINT — drops bed, parks back-right, nozzle warm-idle ─
# Uses cancel_z_drop / cancel_x / cancel_y / cancel_cool_temp from
# _PAUSE_RESUME_VARIABLES (defined in pause_resume.cfg).
[gcode_macro CANCEL_PRINT]
description: Cancel — turn off heaters + wipe + fan-assisted cooldown + park.
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% set v = printer["gcode_macro _PAUSE_RESUME_VARIABLES"] %}
    M400                                  ; finish queued moves
    # Heaters off immediately so cooling starts ASAP.
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    CANCEL_PRINT_BASE

    {% if 'xyz' in printer.toolhead.homed_axes %}
        # Wipe move + retract + Z-hop: pull the nozzle sideways while
        # retracting filament so any drool string is dragged off the
        # tip instead of staying attached. Same idea as a slicer's
        # "wipe at end of layer" feature.
        {% if printer.extruder.can_extrude %}
            G91
            G1 X3 Y-3 E-3 F3000   ; diagonal 4.2 mm move + retract 3 mm
            G1 Z5 F600            ; Z-hop to detach
            G90
        {% endif %}

        # Part fans full to accelerate cooling and prevent further
        # ooze during the move home. Stay on through the park motion.
        SET_PIN PIN=fan0 VALUE=255
        SET_PIN PIN=fan1 VALUE=255

        # Eject: drop bed all the way + park toolhead at back-right
        # corner so the print is accessible from the front.
        G90
        G1 Z{v.present_z_drop} F{v.speed_park_z}
        G1 X{v.present_x} Y{v.present_y} F{v.speed_park_xy}

        # Park reached — turn fans off.
        SET_PIN PIN=fan0 VALUE=0
        SET_PIN PIN=fan1 VALUE=0
    {% endif %}

    SET_GCODE_VARIABLE MACRO=PARK_FOR_PAUSE VARIABLE=is_parked VALUE=0
    M84


# ─── NOZZLE_CLEAR_ON_BRUSH — pre-print clean at 180 C then cool ────
# Hardware: silicone brush physically present at X=-3 Y=50-80 (off-bed).
# Phases:
#   1) Move OFF the bed before any heating to keep ooze off the print area.
#   2) Heat to 180 C, 5 zigzag passes at high speed.
#   3) Retract -2 mm, set M104 S160 (non-blocking), fans full, 12 more
#      zigzag passes while the nozzle cools.
#   4) M109 S140 blocking; fans off; 5 cold brushes.
#   5) Park off-bed, M104 S0.
[gcode_macro NOZZLE_CLEAR_ON_BRUSH]
description: Pre-print nozzle clean — heat to 180 then active brushing during cooldown.
gcode:
    RESPOND TYPE=command MSG="Nozzle cleaning - phase 1: brush at 180C"
    G90
    G1 Z20 F600
    G1 X-3 Y50 F9000
    G1 Z5 F600
    # M104+TEMPERATURE_WAIT (was M109 S180): M109 includes a PID settle
    # check (abs(target-current)<=1 AND integral slope<=0.1) that adds
    # 10-20 s after the target is first reached. For brushing the
    # brush tolerates 180-188 C identically, so we skip the settle.
    M104 S180
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=180
    G1 Z2.5 F600

    {% set x_min = -3 %}
    {% set x_max = -2 %}
    {% set x_mid = -2.5 %}
    {% set y_start = 50 %}
    {% set y_end = 80 %}
    {% set steps = 8 %}
    {% set y_step = (y_end - y_start) / steps %}

    {% for i in range(5) %}
        {% if i % 2 == 0 %}
            G1 X{x_mid} Y{y_start + y_step * 1} F8000
            G1 X{x_max} Y{y_start + y_step * 2} F8000
            G1 X{x_mid} Y{y_start + y_step * 3} F8000
            G1 X{x_min} Y{y_start + y_step * 4} F8000
            G1 X{x_mid} Y{y_start + y_step * 5} F8000
            G1 X{x_max} Y{y_start + y_step * 6} F8000
            G1 X{x_mid} Y{y_start + y_step * 7} F8000
            G1 X{x_min} Y{y_end}                F8000
        {% else %}
            G1 X{x_mid} Y{y_end - y_step * 1}   F8000
            G1 X{x_min} Y{y_end - y_step * 2}   F8000
            G1 X{x_mid} Y{y_end - y_step * 3}   F8000
            G1 X{x_max} Y{y_end - y_step * 4}   F8000
            G1 X{x_mid} Y{y_end - y_step * 5}   F8000
            G1 X{x_min} Y{y_end - y_step * 6}   F8000
            G1 X{x_mid} Y{y_end - y_step * 7}   F8000
            G1 X{x_max} Y{y_start}              F8000
        {% endif %}
    {% endfor %}

    G1 Z5 F600
    G91
    G1 E-2.0 F1800
    G90

    RESPOND TYPE=echo MSG="Phase 2: cooling 180->140C with active brushing"
    M104 S140
    SET_PIN PIN=fan0 VALUE=255
    SET_PIN PIN=fan1 VALUE=255
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=140
    SET_PIN PIN=fan0 VALUE=0
    SET_PIN PIN=fan1 VALUE=0
    
    G1 Z2.5 F600
    {% for i in range(12) %}
        {% if i % 2 == 0 %}
            G1 X{x_mid} Y{y_start + y_step * 2} F8000
            G1 X{x_max} Y{y_start + y_step * 4} F8000
            G1 X{x_mid} Y{y_start + y_step * 6} F8000
            G1 X{x_min} Y{y_end}                F8000
        {% else %}
            G1 X{x_mid} Y{y_end - y_step * 2}   F8000
            G1 X{x_min} Y{y_end - y_step * 4}   F8000
            G1 X{x_mid} Y{y_end - y_step * 6}   F8000
            G1 X{x_max} Y{y_start}              F8000
        {% endif %}
    {% endfor %}

    G1 Z2.5 F600
    G1 X-3 Y50 F9000
    G1 X-2 Y80 F8000
    G1 X-3 Y50 F8000
    G1 X-2 Y80 F8000
    G1 X-3 Y50 F8000

    G1 Z20 F600
    # (No X0 Y50 park — the next macro repositions anyway.)
    M104 S0
    RESPOND TYPE=command MSG="Nozzle cleaning done"


# NOZZLE_CLEAR_AT_PRINT_TEMP removed (2026-05-22). NCB's 22 brushing
# passes (5 hot + 12 cooldown + 5 cold) plus the non-contact bed_mesh
# interlude leave the nozzle clean enough without a second print-temp
# brush. START_PRINT now positions at the prime line start, heats to
# print_temp there (ooze drips on the off-strip area), and goes straight
# into PRIME_LINE. See git log for the previous implementation.


# ─── FINAL_TAP_OFFSET — median of N taps applied as gcode offset ───
# Runs at print conditions (nozzle and bed already at print temps,
# coil thermally settled). 3 taps with retracts between, median of
# last_z_result values applied via SET_GCODE_OFFSET Z=<median>.
# Median (not mean) to reject any single outlier tap.
[gcode_macro FINAL_TAP_OFFSET]
description: 3 taps at print conditions, apply median as gcode offset Z.
variable_taps_data: []
gcode:
    {% set xy_x = params.X|default(200)|float %}
    {% set xy_y = params.Y|default(200)|float %}
    {% set samples = params.SAMPLES|default(3)|int %}

    {% set t_nozzle = printer.extruder.temperature|float %}
    {% set t_bed = printer.heater_bed.temperature|float %}
    {% set t_coil = printer["temperature_probe btt_eddy"].temperature|float %}
    RESPOND TYPE=command MSG="FINAL_TAP_OFFSET: nozzle={'%.1f' % t_nozzle}C bed={'%.1f' % t_bed}C coil={'%.1f' % t_coil}C"

    {% if 'xyz' not in printer.toolhead.homed_axes %}
        {action_raise_error("FINAL_TAP_OFFSET: printer not fully homed")}
    {% endif %}
    {% if t_nozzle < 170 %}
        RESPOND TYPE=command MSG="FINAL_TAP_OFFSET: WARNING - nozzle ({'%.1f' % t_nozzle}C) below typical print temp"
    {% endif %}

    SET_GCODE_VARIABLE MACRO=FINAL_TAP_OFFSET VARIABLE=taps_data VALUE="[]"

    G91
    G1 Z10 F600
    G90
    G1 X{xy_x} Y{xy_y} F6000

    {% for i in range(samples) %}
        G91
        G1 Z3 F300
        G90
        # PROBE_SPEED=8 (default 5): same fix as EDDY_DRIFT_CALIBRATE.
        # At 5 mm/s the tap decelerates over only ~27 µm — just under
        # Klipper's 30 µm minimum depress check, so taps fail randomly
        # with "invalid depress distance (0.029... vs 0.030...)". 8 mm/s
        # gives ~70 µm depress, comfortably inside the 30-250 µm window.
        PROBE METHOD=tap PROBE_SPEED=8
        _RECORD_FINAL_TAP_SAMPLE
    {% endfor %}

    G91
    G1 Z5 F600
    G90
    _APPLY_FINAL_TAP_MEDIAN


[gcode_macro _RECORD_FINAL_TAP_SAMPLE]
description: Internal — append printer.probe.last_z_result to FINAL_TAP_OFFSET.taps_data.
gcode:
    {% set last_z = printer.probe.last_z_result|float %}
    {% set existing = printer["gcode_macro FINAL_TAP_OFFSET"].taps_data %}
    {% set new_data = existing + [last_z] %}
    SET_GCODE_VARIABLE MACRO=FINAL_TAP_OFFSET VARIABLE=taps_data VALUE="{new_data}"


[gcode_macro _APPLY_FINAL_TAP_MEDIAN]
description: Internal — compute median of taps_data and apply via SET_GCODE_OFFSET Z=<median>.
gcode:
    {% set data = printer["gcode_macro FINAL_TAP_OFFSET"].taps_data %}
    {% set n = data|length %}
    {% if n < 1 %}
        {action_raise_error("FINAL_TAP_OFFSET: no samples collected")}
    {% else %}
        {% set sorted_data = data|sort %}
        {% if n % 2 == 1 %}
            {% set median = sorted_data[(n - 1) // 2] %}
        {% else %}
            {% set median = (sorted_data[n // 2 - 1] + sorted_data[n // 2]) / 2 %}
        {% endif %}
        {% set mn = data|min %}
        {% set mx = data|max %}
        {% set rng = mx - mn %}
        RESPOND TYPE=command MSG="FINAL_TAP_OFFSET: median={'%.4f' % median}mm over {n} samples (range {'%.4f' % rng}mm)"
        # SET_GCODE_OFFSET Z= absolu (pas Z_ADJUST=) pour eviter accumulation.
        # MOVE=0 pour ne pas deplacer le toolhead immediatement.
        SET_GCODE_OFFSET Z={median} MOVE=0
    {% endif %}


# ─── PRIME_LINE — on-strip 3-pass prime + ooze-compensation pre-purge ──
# Hardware: prints on the non-printable strip at X=-1 to X=-0.2 (inside
# bed axis_minimum.x = -5, but outside the printable area). Lines are
# visible on the strip there.
#
# 3 lines × E15 extrude at Z=0.5 (thicker + bigger flow than the v1 Z=0.28
# 2-line design — v1 was under-extruded because the gcode-tracked restore
# didn't account for END_PRINT's -2 mm retract or idle ooze).
#
# Caller (START_PRINT) is expected to have already positioned X/Y at
# (-1, 120) and heated to print_temp before invoking us. The macro has
# a conditional heat block below as a safety net for standalone use.
#
# E balance:
#   - Restore +N where N = -gcode_position.e (= 2 mm from NCB-only)
#   - Pre-purge +5 mm: covers END_PRINT's untracked -2 mm retract + ooze
#     drain (~30 s 140 -> print_temp ramp drips a few mm of melted PLA
#     out of the nozzle tip while the extruder is idle).
#   - 3 prime lines × E15 each = +45 mm
#   - Anti-ooze retract -3 mm
#   - NET: +49 mm consumed per START_PRINT
#
# M83 (relative E) forced inside to make the line E values self-evident
# regardless of slicer-emitted M82/M83 mode.
[gcode_macro PRIME_LINE]
description: 3-pass on-strip prime + ooze-comp pre-purge (Z=0.5, ~45 mm extrude).
gcode:
    {% set print_state = printer.print_stats.state %}
    {% if print_state == 'printing' %}
        {% set target = printer.extruder.target|float %}
    {% else %}
        {% set target = 220.0 %}
    {% endif %}

    # Standalone safety net — heat + position if not already prepared by
    # the caller. In the START_PRINT chain these are no-ops (already done).
    {% set current = printer.extruder.temperature|float %}
    {% if current < target - 1 %}
        G90
        G1 X-1.0 Y120 Z5 F6000
        RESPOND TYPE=command MSG="Heating nozzle to {target}C"
        M104 S{target}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target}
    {% endif %}

    RESPOND TYPE=command MSG="Priming"

    # Drop to print Z (caller had us at Z=5 for the heat ramp).
    G90
    G1 Z0.5 F600

    # Force relative E so the line E values below are unambiguous
    # regardless of what M82/M83 the slicer set before START_PRINT.
    M83

    # Restore the cumulative gcode-tracked retract (NCB's -2 mm).
    {% set e_pos = printer.gcode_move.gcode_position.e|float %}
    {% if e_pos < 0 %}
        RESPOND TYPE=command MSG="Restoring filament ({'%.2f' % (-e_pos)}mm)"
        G1 E{-e_pos} F1800
        G92 E0
    {% endif %}

    # Pre-purge: compensates for END_PRINT's untracked -2 mm retract +
    # the ooze that drained the nozzle tip during the 140 -> print_temp
    # ramp at this position. Slow F300 (5 mm/s ~12 mm³/s) — brief burst
    # above PLA's ~10 mm³/s sustained limit is fine.
    RESPOND TYPE=command MSG="Pre-purge +5 mm (ooze comp)"
    G1 E5 F300
    G92 E0

    RESPOND TYPE=command MSG="Drawing prime lines (3 passes at Z=0.5)"
    # 3 prime lines at Z=0.5, ~0.58 mm wide (E15 over 125 mm at F2000).
    # Flow rate: 15 × 2.405 / (125/(2000/60)) = 9.6 mm³/s — under PLA's
    # ~10 mm³/s sustained limit.
    G1 X-1.0 Y245.0 F2000 E15
    G1 X-0.6 Y245.0 F5000
    G1 X-0.6 Y120 F2000 E15
    G1 X-0.2 Y120 F5000
    G1 X-0.2 Y245.0 F2000 E15
    G92 E0

    # Anti-ooze retract before the slicer takes over. -3 mm pulls the
    # filament tip out of the hottest part of the melt zone.
    G1 E-3.0 F2400
    # Z=5 gives the slicer's travel clearance over the prime lines.
    G1 Z5.0 F3000
