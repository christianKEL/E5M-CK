# ═══════════════════════════════════════════════════════════════════════
# Print lifecycle macros — START_PRINT / END_PRINT / CANCEL_PRINT
# plus the nozzle-cleaning + Z-precision + prime-line helpers that
# START_PRINT chains together.
#
# Slicer contract: slicer's start G-code calls
#   START_PRINT BED_TEMP=<n> EXTRUDER_TEMP=<n>
# and end G-code calls END_PRINT.
#
# Differences vs v1:
#   - EDDY_RESET_TO_CONFIG dropped — our v2 baked everything into config
#     (drive_current, freq table, tap_threshold, drift_calibration).
#     Nothing drifts at runtime that needs explicit reset.
#   - FULL_CALIBRATE dropped — it called custom-fork commands not in
#     Klipper master, and v1 had to recalibrate the Eddy table at every
#     print because no drift compensation existed. v2 has drift comp
#     enabled (auto-loaded from config on each Klipper start).
#   - Added PRECISE_HOME step (homing.cfg) just before BED_MESH_CALIBRATE
#     so the mesh builds on a tap-precision Z=0 reference (~±5 µm)
#     instead of the scan-based ~±50 µm.
#   - FINAL_TAP_OFFSET ported as-is — only uses standard Klipper master
#     commands (PROBE METHOD=tap, SET_GCODE_OFFSET).
#   - NOZZLE_CLEAR_ON_BRUSH / NOZZLE_CLEAR_AT_PRINT_TEMP / PRIME_LINE
#     ported verbatim from v1 (hardware-dependent: silicone brush at
#     X=-3 Y=50-80, off-bed purge at X=-1 Y=120).
# ═══════════════════════════════════════════════════════════════════════


# ─── START_PRINT ───────────────────────────────────────────────────
[gcode_macro START_PRINT]
description: Full start sequence — heat, soak, home, clean, mesh, tap-refine, prime.
gcode:
    {% set bed_temp      = params.BED_TEMP|default(60)|int %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(220)|int %}
    {% set soak_time     = params.SOAK_TIME|default(300)|int %}
    {% set threshold     = params.THRESHOLD|default(5)|float %}

    # ─── State reset ─────────────────────────────────────────
    SET_GCODE_OFFSET Z=0
    BED_MESH_CLEAR
    G92 E0
    M220 S100
    M221 S100

    # ─── Abort early if no filament ──────────────────────────
    {% if not printer["filament_switch_sensor filament_sensor"].filament_detected %}
        {action_raise_error("START_PRINT aborted: no filament detected")}
    {% endif %}

    # ─── Heat bed with conditional soak ──────────────────────
    # Skip the soak penalty when chaining prints on an already-warm bed.
    {% set current = printer.heater_bed.temperature|float %}
    {% set delta   = bed_temp - current %}
    RESPOND TYPE=command MSG="Bed: current={'%.1f' % current}C target={'%.1f' % bed_temp}C delta={'%.1f' % delta}C"
    M190 S{bed_temp}
    {% if delta >= threshold %}
        RESPOND TYPE=command MSG="Heat soak {(soak_time / 60)|int} min (delta >= {threshold}C)"
        G4 P{soak_time * 1000}
    {% else %}
        RESPOND TYPE=command MSG="Heat soak skipped (delta < {threshold}C)"
    {% endif %}

    # ─── Warm nozzle for tap-capable operations, then home ───
    RESPOND TYPE=command MSG="Heating nozzle to 140C for homing/tap"
    M109 S140
    RESPOND TYPE=command MSG="Homing"
    G28

    # ─── Nozzle cleaning (cycles 180 -> 140, retract -2 mm internally) ──
    RESPOND TYPE=command MSG="Nozzle cleaning on brush"
    NOZZLE_CLEAR_ON_BRUSH

    # NOZZLE_CLEAR_ON_BRUSH ends with M104 S0; bring the nozzle back to
    # 140 C for the tap probe and mesh that follow.
    M109 S140

    # ─── Bed mesh ────────────────────────────────────────────
    # Note: PRECISE_HOME (tap-refined Z=0) was tried here in early v2
    # development but caused "probe_eddy_current sensor not in valid
    # range" failures during rapid_scan. Root cause: SET_KINEMATIC_POSITION
    # in PRECISE_HOME shifts the kinematic frame by ~10 µm, but the
    # static probe_eddy_current calibrate table was generated in the
    # original (scan-based) frame. The shifted lookup pushes borderline
    # samples (near table edges Z=0.05 or Z=4.05) out of range and the
    # scan aborts. V1 worked around this by re-running PROBE_EDDY_CALIBRATE
    # at every print start (FULL_CALIBRATE); v2 relies on the static cal
    # + drift compensation. So we skip PRECISE_HOME here and let
    # FINAL_TAP_OFFSET handle Z=0 correction via SET_GCODE_OFFSET after
    # the mesh — that path doesn't shift the kinematic frame.
    # rapid_scan exploits the Eddy probe's continuous-readout mode; the
    # drift compensation table loaded at boot keeps the readings accurate
    # across coil-temperature variations during the scan.
    RESPOND TYPE=command MSG="Bed mesh calibrating"
    BED_MESH_CALIBRATE METHOD=rapid_scan

    # ─── Final clean at print temp + cumulative -8 mm retract ────
    G1 Z5 F600
    NOZZLE_CLEAR_AT_PRINT_TEMP TEMP={extruder_temp}

    # ─── Final tap at exact print conditions ─────────────────
    # Tap is now done at the same nozzle/coil temperature as the
    # actual print, so any residual thermal drift between the
    # PRECISE_HOME refinement (nozzle 140) and the print is corrected
    # via SET_GCODE_OFFSET.
    RESPOND TYPE=command MSG="Final tap at print temperature"
    FINAL_TAP_OFFSET

    # ─── Prime line (auto-restores the cumulative -10 mm retract) ──
    PRIME_LINE

    SET_PIN PIN=light_pin VALUE=1
    RESPOND TYPE=command MSG="Printing"


# ─── END_PRINT ─────────────────────────────────────────────────────
[gcode_macro END_PRINT]
description: Post-print cleanup — retract, park, motors off.
gcode:
    M400                           ; finish all moves
    M104 S0                        ; hotend off
    M140 S0                        ; bed off
    G91
    G1 E-2 F2700                   ; small retract
    G1 Z5 F600                     ; lift Z 5 mm (bed drops 5 mm on E5M)
    G90
    G1 X10 Y390 F6000              ; park near front-left
    M84                            ; disable motors


# ─── CANCEL_PRINT — drops bed, parks back-right, nozzle warm-idle ─
# Uses cancel_z_drop / cancel_x / cancel_y / cancel_cool_temp from
# _PAUSE_RESUME_VARIABLES (defined in pause_resume.cfg).
[gcode_macro CANCEL_PRINT]
description: Cancel the running print cleanly — drops bed, parks back-right.
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% set v = printer["gcode_macro _PAUSE_RESUME_VARIABLES"] %}
    M400                                  ; finish queued moves
    # Non-blocking: keep nozzle warm-idle at cancel_cool_temp so user
    # can quickly re-print without a full reheat. Bed off entirely.
    M104 S{v.cancel_cool_temp}
    M140 S0
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    CANCEL_PRINT_BASE
    # Eject pattern: drop bed all the way + park toolhead at back-right
    # corner so the print is exposed and accessible from the front.
    {% if 'xyz' in printer.toolhead.homed_axes %}
        G90
        G1 Z{v.cancel_z_drop} F{v.speed_park_z}
        G1 X{v.cancel_x} Y{v.cancel_y} F{v.speed_park_xy}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=PARK_FOR_PAUSE VARIABLE=is_parked VALUE=0
    M84


# ─── NOZZLE_CLEAR_ON_BRUSH — pre-print clean at 180 C then cool ────
# Hardware: silicone brush physically present at X=-3 Y=50-80 (off-bed).
# Phases:
#   1) Move OFF the bed before any heating to keep ooze off the print area.
#   2) Heat to 180 C, 5 zigzag passes at high speed.
#   3) Retract -2 mm, set M104 S160 (non-blocking), fans full, 12 more
#      zigzag passes while the nozzle cools.
#   4) M109 S140 blocking; fans off; 5 cold brushes.
#   5) Park off-bed, M104 S0.
[gcode_macro NOZZLE_CLEAR_ON_BRUSH]
description: Pre-print nozzle clean — heat to 180 then active brushing during cooldown.
gcode:
    RESPOND TYPE=command MSG="Nozzle cleaning - phase 1: brush at 180C"
    G90
    G1 Z20 F600
    G1 X-3 Y50 F9000
    G1 Z5 F600
    M109 S180
    G1 Z2.5 F600

    {% set x_min = -3 %}
    {% set x_max = -2 %}
    {% set x_mid = -2.5 %}
    {% set y_start = 50 %}
    {% set y_end = 80 %}
    {% set steps = 8 %}
    {% set y_step = (y_end - y_start) / steps %}

    {% for i in range(5) %}
        {% if i % 2 == 0 %}
            G1 X{x_mid} Y{y_start + y_step * 1} F8000
            G1 X{x_max} Y{y_start + y_step * 2} F8000
            G1 X{x_mid} Y{y_start + y_step * 3} F8000
            G1 X{x_min} Y{y_start + y_step * 4} F8000
            G1 X{x_mid} Y{y_start + y_step * 5} F8000
            G1 X{x_max} Y{y_start + y_step * 6} F8000
            G1 X{x_mid} Y{y_start + y_step * 7} F8000
            G1 X{x_min} Y{y_end}                F8000
        {% else %}
            G1 X{x_mid} Y{y_end - y_step * 1}   F8000
            G1 X{x_min} Y{y_end - y_step * 2}   F8000
            G1 X{x_mid} Y{y_end - y_step * 3}   F8000
            G1 X{x_max} Y{y_end - y_step * 4}   F8000
            G1 X{x_mid} Y{y_end - y_step * 5}   F8000
            G1 X{x_min} Y{y_end - y_step * 6}   F8000
            G1 X{x_mid} Y{y_end - y_step * 7}   F8000
            G1 X{x_max} Y{y_start}              F8000
        {% endif %}
    {% endfor %}

    G1 Z5 F600
    G91
    G1 E-2.0 F1800
    G90

    RESPOND TYPE=echo MSG="Phase 2: cooling 180->140C with active brushing"
    M104 S160
    SET_PIN PIN=fan0 VALUE=255
    SET_PIN PIN=fan1 VALUE=255
    G1 Z2.5 F600
    {% for i in range(12) %}
        {% if i % 2 == 0 %}
            G1 X{x_mid} Y{y_start + y_step * 2} F8000
            G1 X{x_max} Y{y_start + y_step * 4} F8000
            G1 X{x_mid} Y{y_start + y_step * 6} F8000
            G1 X{x_min} Y{y_end}                F8000
        {% else %}
            G1 X{x_mid} Y{y_end - y_step * 2}   F8000
            G1 X{x_min} Y{y_end - y_step * 4}   F8000
            G1 X{x_mid} Y{y_end - y_step * 6}   F8000
            G1 X{x_max} Y{y_start}              F8000
        {% endif %}
    {% endfor %}

    RESPOND TYPE=echo MSG="Phase 3: stabilize at 140C"
    # M104 (non-blocking) instead of M109: at the end of Phase 2 the
    # nozzle is typically 145-160 C (12 zigzag passes + fan cooldown
    # from 180). M109 S140 would then wait for passive cooldown to
    # exactly 140 — adds 10-30 s of dead time. M104 sets the target
    # and lets Phase 4's "cold brushes" proceed immediately at whatever
    # temperature the cooldown reached. Brushing at 145-150 vs 140 is
    # cosmetically identical and saves wall-clock.
    M104 S140
    SET_PIN PIN=fan0 VALUE=0
    SET_PIN PIN=fan1 VALUE=0

    G1 Z2.5 F600
    G1 X-3 Y50 F9000
    G1 X-2 Y80 F8000
    G1 X-3 Y50 F8000
    G1 X-2 Y80 F8000
    G1 X-3 Y50 F8000

    G1 Z20 F600
    G1 X0 Y50 F9000
    M104 S0
    RESPOND TYPE=command MSG="Nozzle cleaning done"


# ─── NOZZLE_CLEAR_AT_PRINT_TEMP — 2-step ramp brush + anti-ooze retract ─
# Hardware: same brush as above. Net E balance is -8 mm; PRIME_LINE
# auto-restores via printer.gcode_move.gcode_position.e.
[gcode_macro NOZZLE_CLEAR_AT_PRINT_TEMP]
description: Final clean at print temp — 2-step heat ramp + cumulative -8 mm retract.
gcode:
    {% set print_temp = params.TEMP|default(210)|int %}
    RESPOND TYPE=command MSG="Nozzle clean at print temp ({print_temp}C)"

    G90
    G1 Z20 F600
    G1 X-3 Y20 F9000
    G1 Z5 F600

    RESPOND TYPE=command MSG="Heat ramp step 1: 180C"
    M109 S180
    G91
    G1 E-3.0 F300
    G90
    G1 Z2.5 F600

    {% set x_min = -3 %}
    {% set x_max = -2 %}
    {% set x_mid = -2.5 %}
    {% set y_start = 50 %}
    {% set y_end = 80 %}
    {% set steps = 8 %}
    {% set y_step = (y_end - y_start) / steps %}

    {% for i in range(5) %}
        {% if i % 2 == 0 %}
            G1 X{x_mid} Y{y_start + y_step * 1} F8000
            G1 X{x_max} Y{y_start + y_step * 2} F8000
            G1 X{x_mid} Y{y_start + y_step * 3} F8000
            G1 X{x_min} Y{y_start + y_step * 4} F8000
            G1 X{x_mid} Y{y_start + y_step * 5} F8000
            G1 X{x_max} Y{y_start + y_step * 6} F8000
            G1 X{x_mid} Y{y_start + y_step * 7} F8000
            G1 X{x_min} Y{y_end}                F8000
        {% else %}
            G1 X{x_mid} Y{y_end - y_step * 1}   F8000
            G1 X{x_min} Y{y_end - y_step * 2}   F8000
            G1 X{x_mid} Y{y_end - y_step * 3}   F8000
            G1 X{x_max} Y{y_end - y_step * 4}   F8000
            G1 X{x_mid} Y{y_end - y_step * 5}   F8000
            G1 X{x_min} Y{y_end - y_step * 6}   F8000
            G1 X{x_mid} Y{y_end - y_step * 7}   F8000
            G1 X{x_max} Y{y_start}              F8000
        {% endif %}
    {% endfor %}

    G90
    G1 Z5 F600
    G1 X-3 Y20 F9000

    RESPOND TYPE=command MSG="Heat ramp step 2: {print_temp}C"
    M109 S{print_temp}

    G91
    G1 E3.0 F300        ; un-retract the cool-retract
    G1 E5.0 F2400       ; flush purge
    G1 E-5.0 F2400      ; stop drool
    G90
    G1 Z2.5 F600

    {% for i in range(5) %}
        {% if i % 2 == 0 %}
            G1 X{x_mid} Y{y_start + y_step * 1} F8000
            G1 X{x_max} Y{y_start + y_step * 2} F8000
            G1 X{x_mid} Y{y_start + y_step * 3} F8000
            G1 X{x_min} Y{y_start + y_step * 4} F8000
            G1 X{x_mid} Y{y_start + y_step * 5} F8000
            G1 X{x_max} Y{y_start + y_step * 6} F8000
            G1 X{x_mid} Y{y_start + y_step * 7} F8000
            G1 X{x_min} Y{y_end}                F8000
        {% else %}
            G1 X{x_mid} Y{y_end - y_step * 1}   F8000
            G1 X{x_min} Y{y_end - y_step * 2}   F8000
            G1 X{x_mid} Y{y_end - y_step * 3}   F8000
            G1 X{x_max} Y{y_end - y_step * 4}   F8000
            G1 X{x_mid} Y{y_end - y_step * 5}   F8000
            G1 X{x_min} Y{y_end - y_step * 6}   F8000
            G1 X{x_mid} Y{y_end - y_step * 7}   F8000
            G1 X{x_max} Y{y_start}              F8000
        {% endif %}
    {% endfor %}

    G90
    G1 Z20 F600
    G1 X-3 Y20 F9000
    G91
    G1 E-5.0 F2400
    G4 P800
    G1 E-3.0 F2400
    G90
    # Macro net E balance: -3 +3 +5 -5 -5 -3 = -8 mm
    # (PRIME_LINE auto-restores via printer.gcode_move.gcode_position.e)
    RESPOND TYPE=command MSG="Nozzle cleaned at {print_temp}C, ready"


# ─── FINAL_TAP_OFFSET — median of N taps applied as gcode offset ───
# Runs at print conditions (nozzle and bed already at print temps,
# coil thermally settled). 3 taps with retracts between, median of
# last_z_result values applied via SET_GCODE_OFFSET Z=<median>.
# Median (not mean) to reject any single outlier tap.
[gcode_macro FINAL_TAP_OFFSET]
description: 3 taps at print conditions, apply median as gcode offset Z.
variable_taps_data: []
gcode:
    {% set xy_x = params.X|default(200)|float %}
    {% set xy_y = params.Y|default(200)|float %}
    {% set samples = params.SAMPLES|default(3)|int %}

    {% set t_nozzle = printer.extruder.temperature|float %}
    {% set t_bed = printer.heater_bed.temperature|float %}
    {% set t_coil = printer["temperature_probe btt_eddy"].temperature|float %}
    RESPOND TYPE=command MSG="FINAL_TAP_OFFSET: nozzle={'%.1f' % t_nozzle}C bed={'%.1f' % t_bed}C coil={'%.1f' % t_coil}C"

    {% if 'xyz' not in printer.toolhead.homed_axes %}
        {action_raise_error("FINAL_TAP_OFFSET: printer not fully homed")}
    {% endif %}
    {% if t_nozzle < 170 %}
        RESPOND TYPE=command MSG="FINAL_TAP_OFFSET: WARNING - nozzle ({'%.1f' % t_nozzle}C) below typical print temp"
    {% endif %}

    SET_GCODE_VARIABLE MACRO=FINAL_TAP_OFFSET VARIABLE=taps_data VALUE="[]"

    G91
    G1 Z10 F600
    G90
    G1 X{xy_x} Y{xy_y} F6000

    {% for i in range(samples) %}
        G91
        G1 Z3 F300
        G90
        # PROBE_SPEED=8 (default 5): same fix as EDDY_DRIFT_CALIBRATE.
        # At 5 mm/s the tap decelerates over only ~27 µm — just under
        # Klipper's 30 µm minimum depress check, so taps fail randomly
        # with "invalid depress distance (0.029... vs 0.030...)". 8 mm/s
        # gives ~70 µm depress, comfortably inside the 30-250 µm window.
        PROBE METHOD=tap PROBE_SPEED=8
        _RECORD_FINAL_TAP_SAMPLE
    {% endfor %}

    G91
    G1 Z5 F600
    G90
    _APPLY_FINAL_TAP_MEDIAN


[gcode_macro _RECORD_FINAL_TAP_SAMPLE]
description: Internal — append printer.probe.last_z_result to FINAL_TAP_OFFSET.taps_data.
gcode:
    {% set last_z = printer.probe.last_z_result|float %}
    {% set existing = printer["gcode_macro FINAL_TAP_OFFSET"].taps_data %}
    {% set new_data = existing + [last_z] %}
    SET_GCODE_VARIABLE MACRO=FINAL_TAP_OFFSET VARIABLE=taps_data VALUE="{new_data}"


[gcode_macro _APPLY_FINAL_TAP_MEDIAN]
description: Internal — compute median of taps_data and apply via SET_GCODE_OFFSET Z=<median>.
gcode:
    {% set data = printer["gcode_macro FINAL_TAP_OFFSET"].taps_data %}
    {% set n = data|length %}
    {% if n < 1 %}
        {action_raise_error("FINAL_TAP_OFFSET: no samples collected")}
    {% else %}
        {% set sorted_data = data|sort %}
        {% if n % 2 == 1 %}
            {% set median = sorted_data[(n - 1) // 2] %}
        {% else %}
            {% set median = (sorted_data[n // 2 - 1] + sorted_data[n // 2]) / 2 %}
        {% endif %}
        {% set mn = data|min %}
        {% set mx = data|max %}
        {% set rng = mx - mn %}
        RESPOND TYPE=command MSG="FINAL_TAP_OFFSET: median={'%.4f' % median}mm over {n} samples (range {'%.4f' % rng}mm)"
        # SET_GCODE_OFFSET Z= absolu (pas Z_ADJUST=) pour eviter accumulation.
        # MOVE=0 pour ne pas deplacer le toolhead immediatement.
        SET_GCODE_OFFSET Z={median} MOVE=0
    {% endif %}


# ─── PRIME_LINE — off-bed prime line + auto-restore retracted E ────
# Hardware: prints on the off-bed strip at X=-1 (just outside bed
# axis_minimum.x = -5). The drool falls next to the printer; print bed
# stays clean. Auto-restores any cumulative retract from prior NOZZLE_*
# macros via printer.gcode_move.gcode_position.e.
[gcode_macro PRIME_LINE]
description: Draw a prime line off-bed at X=-1 (auto-restores cumulative E retract).
gcode:
    {% set print_state = printer.print_stats.state %}
    {% if print_state == 'printing' %}
        {% set target = printer.extruder.target|float %}
    {% else %}
        {% set target = 220.0 %}
    {% endif %}

    RESPOND TYPE=command MSG="Positioning"
    G90
    G1 X-1.0 Y120 Z20 F5000.0

    {% set current = printer.extruder.temperature|float %}
    M104 S{target}
    {% if current < target - 1 %}
        RESPOND TYPE=command MSG="Heating nozzle to {target}C"
        M109 S{target}
    {% endif %}

    RESPOND TYPE=command MSG="Priming"
    G1 X-1.0 Y120 Z0.28 F5000.0

    # Auto-restore any cumulative retract from NOZZLE_CLEAR_* macros.
    {% set e_pos = printer.gcode_move.gcode_position.e|float %}
    {% if e_pos < 0 %}
        RESPOND TYPE=command MSG="Restoring filament ({'%.2f' % (-e_pos)}mm)"
        G91
        G1 E{-e_pos} F1800
        G90
        G92 E0
    {% endif %}

    RESPOND TYPE=command MSG="Drawing prime line"
    G1 X-1.0 Y245.0 Z0.28 F1500.0 E7
    G1 X-0.6 Y245.0 Z0.28 F5000.0
    G1 X-0.6 Y120 Z0.28 F1500.0 E15
    G92 E0
    # Strong anti-ooze retract before the slicer takes over.
    # The slicer typically does its own travel (~1-3 s at F9000-F15000)
    # from here to the first print point. At print_temp 220-300 C, ooze
    # rate is 0.3-1.5 mm/s — a -1 mm retract (v1) leaves drool blobs at
    # the first-layer start. -3 mm pulls the filament tip out of the
    # hottest part of the melt zone. Trade-off: ~3 mm of under-extrusion
    # on the first slicer move, acceptable because the slicer's first
    # extrusion is usually a long perimeter where 3 mm gets absorbed
    # quickly.
    G1 E-3.0 F2400
    # Z=5 instead of v1's Z=2 gives the slicer's travel comfortable
    # clearance over the prime line and any small residual drool.
    G1 Z5.0 F3000
