# ═══════════════════════════════════════════════════════════════════════
# pause_resume.cfg — pause / resume / M600 / filament change.
#
# Wired together as a complete chain:
#
#   PAUSE / Guppy pause button
#     -> BASE_PAUSE (Klipper built-in: halts queue, records position)
#     -> PARK_FOR_PAUSE: SAVE_GCODE_STATE pause_state, retract, PARK
#
#   RESUME / Guppy resume button
#     -> un-retract the same amount FIRST (avoids 5 mm of under-extrusion
#        when the print resumes — a common bug with naive pause macros)
#     -> RESTORE_GCODE_STATE pause_state MOVE=1 (move XY back to print pos,
#        restore E counter)
#     -> reset is_parked flag
#     -> BASE_RESUME (Klipper built-in: continues the queue)
#
#   M600 (slicer color/material change)
#     -> just calls PAUSE; our override handles parking. Operator then
#        uses LOAD/UNLOAD via Guppy and clicks Resume.
#
#   LOAD_FILAMENT / UNLOAD_FILAMENT
#     -> wired into guppyconfig.json default_macros, so Guppy's Load /
#        Unload buttons trigger our richer sequences instead of the
#        inline 3-liners that ship with Guppy.
#
# Notes:
#   - idle_timeout is 99999999 in printer.cfg (effectively infinite), so
#     we don't need SET_IDLE_TIMEOUT extension during pause.
#   - LOAD_FILAMENT in pause mode (during M600) skips heat/cool and
#     skips SAVE/RESTORE_GCODE_STATE so the E counter stays consistent
#     with what BASE_RESUME will restore.
# ═══════════════════════════════════════════════════════════════════════


# ─── Centralized parameters ────────────────────────────────────────
[gcode_macro _PAUSE_RESUME_VARIABLES]
description: Constants used by PARK / PARK_FOR_PAUSE / PAUSE / RESUME / CANCEL_PRINT / END_PRINT / M600.
# Pause-park position (XY)
variable_park_x          : -1.0
variable_park_y          : 120.0
variable_park_z_lift     : 100.0

# Retract amounts (mm)
variable_retract_pause   : 5.0

# Speeds (mm/min)
variable_speed_park_xy   : 5000
variable_speed_park_z    : 600
variable_speed_retract   : 1800

# Print presentation (used by END_PRINT and CANCEL_PRINT — same geometry:
# drop bed to the bottom so the print is accessible, park toolhead at
# back-right out of the way of the print).
variable_present_z_drop  : 380.0      # Bed Z to present the print (E5M: Z+ = bed DOWN)
variable_present_x       : 395.0      # X park (back-right)
variable_present_y       : 395.0      # Y park (back-right)

# Cancel-specific
variable_cancel_cool_temp: 140        # Hotend cool TARGET after cancel (M104, non-blocking)
gcode:


# ─── PARK: move toolhead to safe park position ─────────────────────
[gcode_macro PARK]
description: Park toolhead at safe position (uses _PAUSE_RESUME_VARIABLES).
gcode:
    {% set v = printer["gcode_macro _PAUSE_RESUME_VARIABLES"] %}
    {% set xy_homed = 'x' in printer.toolhead.homed_axes
                       and 'y' in printer.toolhead.homed_axes %}
    {% if not xy_homed %}
        RESPOND TYPE=error MSG="PARK aborted: X or Y not homed"
    {% else %}
        # Z handling: lift if homed, else FORCE_MOVE the bed down a bit.
        # On E5M (moving-bed CoreXY) "Z+" means bed moves DOWN, which is
        # what we want — more clearance away from the print.
        {% if 'z' in printer.toolhead.homed_axes %}
            {% set z_max = printer.toolhead.axis_maximum.z|float %}
            {% set z_cur = printer.toolhead.position.z|float %}
            {% set z_target = [z_cur + v.park_z_lift, z_max - 1]|min %}
            G90
            G1 Z{z_target} F{v.speed_park_z}
        {% else %}
            FORCE_MOVE STEPPER=stepper_z DISTANCE=10 VELOCITY=5
            RESPOND TYPE=command MSG="PARK: Z not homed - bed lowered 10mm via FORCE_MOVE"
        {% endif %}

        # XY to park position.
        G90
        G1 X{v.park_x} Y{v.park_y} F{v.speed_park_xy}

        RESPOND TYPE=command MSG="Parked at X{v.park_x} Y{v.park_y}"
    {% endif %}


# ─── PARK_FOR_PAUSE: save state + retract + park ───────────────────
# Called automatically by our PAUSE override; can also be invoked
# manually for ad-hoc parking outside of a print.
[gcode_macro PARK_FOR_PAUSE]
description: Save state, retract, then park (auto-called by PAUSE).
variable_is_parked: 0
gcode:
    {% set v = printer["gcode_macro _PAUSE_RESUME_VARIABLES"] %}
    {% set is_parked = printer["gcode_macro PARK_FOR_PAUSE"].is_parked|int %}
    {% set is_paused = printer.pause_resume.is_paused %}
    {% set print_state = printer.print_stats.state %}
    {% set print_active = print_state in ['printing', 'paused'] %}

    {% if is_parked == 1 %}
        RESPOND TYPE=error MSG="PARK_FOR_PAUSE: already parked"
    {% elif print_active and not is_paused %}
        RESPOND TYPE=error MSG="PARK_FOR_PAUSE: call PAUSE first"
    {% elif is_paused %}
        {% if printer.extruder.can_extrude %}
            SAVE_GCODE_STATE NAME=pause_state
            G91
            G1 E-{v.retract_pause} F{v.speed_retract}
            G90
            PARK
            SET_GCODE_VARIABLE MACRO=PARK_FOR_PAUSE VARIABLE=is_parked VALUE=1
            RESPOND TYPE=command MSG="Parked for pause - call RESUME to continue"
        {% else %}
            RESPOND TYPE=error MSG="PARK_FOR_PAUSE: extruder too cold for retract"
        {% endif %}
    {% else %}
        PARK
        RESPOND TYPE=command MSG="Parked (idle, no retract)"
    {% endif %}


# ─── PAUSE override ───────────────────────────────────────────────
# Klipper's built-in PAUSE just halts the queue and records position.
# We chain PARK_FOR_PAUSE so the operator immediately gets a parked
# toolhead (5 mm retracted) to work on the print.
[gcode_macro PAUSE]
description: Pause the running print and park (chains PARK_FOR_PAUSE).
rename_existing: BASE_PAUSE
gcode:
    BASE_PAUSE
    PARK_FOR_PAUSE


# ─── RESUME override ──────────────────────────────────────────────
# Reverses PARK_FOR_PAUSE: un-retract the same 5 mm BEFORE restoring
# state, then RESTORE_GCODE_STATE MOVE=1 to drive XY back to the print
# position. The E un-retract must happen first so the slicer's E
# counter (saved by SAVE_GCODE_STATE and restored by RESTORE) lines up
# with where the filament physically ends up — otherwise the first
# 5 mm of print after resume comes out under-extruded.
[gcode_macro RESUME]
description: Resume from pause — un-retract then restore state.
rename_existing: BASE_RESUME
gcode:
    {% set v = printer["gcode_macro _PAUSE_RESUME_VARIABLES"] %}
    {% set is_parked = printer["gcode_macro PARK_FOR_PAUSE"].is_parked|int %}
    {% if is_parked == 1 %}
        {% if printer.extruder.can_extrude %}
            G91
            G1 E{v.retract_pause} F{v.speed_retract}
            G90
        {% else %}
            RESPOND TYPE=error MSG="RESUME: extruder too cold to un-retract — first 5 mm will be under-extruded"
        {% endif %}
        RESTORE_GCODE_STATE NAME=pause_state MOVE=1 MOVE_SPEED={(v.speed_park_xy / 60)|int}
        SET_GCODE_VARIABLE MACRO=PARK_FOR_PAUSE VARIABLE=is_parked VALUE=0
    {% endif %}
    BASE_RESUME


# ─── M600: slicer-triggered filament change ───────────────────────
# Slicers emit M600 at color-change layers (or when the runout sensor
# fires). We map it to PAUSE — our PAUSE override parks; the operator
# then uses Guppy Load/Unload buttons to swap, and clicks Resume.
[gcode_macro M600]
description: Filament change — pauses the print for mid-print swap.
gcode:
    PAUSE


# ─── LOAD_FILAMENT — pause-aware load ─────────────────────────────
# Two modes:
#   - In pause (M600 mid-print): no heat (assume hot), no SAVE/RESTORE
#     (preserves the E counter that RESUME's RESTORE_GCODE_STATE
#     will re-apply).
#   - Standalone (out of print): SAVE/RESTORE state, M109 wait, M104 S0
#     after so the user doesn't leave a hot nozzle.
[gcode_macro LOAD_FILAMENT]
description: Load filament — pause-aware (skip heat in M600 mode).
gcode:
    {% set extruder_temp = params.EXTRUDER_TEMP|default(220)|int %}
    {% set extrude_len = params.EXTRUDE_LEN|default(75)|int %}
    {% set is_paused = printer.pause_resume.is_paused %}

    {% if is_paused %}
        {% if not printer.extruder.can_extrude %}
            RESPOND TYPE=error MSG="LOAD_FILAMENT: extruder too cold"
        {% else %}
            G91
            G1 E{extrude_len} F180
            G90
            RESPOND TYPE=command MSG="Filament loaded - call RESUME to continue"
        {% endif %}
    {% else %}
        SAVE_GCODE_STATE NAME=load_filament_state
        M109 S{extruder_temp}
        G91
        G1 E{extrude_len} F180
        M104 S0
        RESTORE_GCODE_STATE NAME=load_filament_state
    {% endif %}


# ─── UNLOAD_FILAMENT — anti-ringing extract sequence ──────────────
# Prime 100 mm to push any debris through, then a ramp of E+/E- jogs
# at increasing feedrates to break the filament-tip cone (the "ringing"
# whisker that catches in the heatbreak), finishing with a fast 15 mm
# extract. Empirically tuned in v1.
#
# Two modes, same shape as LOAD_FILAMENT:
#   - In pause (during M600): skip M109 (assume already hot from
#     the print), skip M104 S0 (must STAY hot — the user is about
#     to LOAD a new filament next), skip SAVE/RESTORE_GCODE_STATE
#     (the E counter will be reset by RESUME's RESTORE of pause_state
#     anyway, and we don't want UNLOAD's RESTORE to interfere).
#   - Standalone (out of print): full sequence with heat-and-cool.
#
# The pause-mode skip of M104 S0 was a real bug in the v1 macro —
# the unconditional cool-down made the immediately-following LOAD
# fail with "extruder too cold" until the user manually re-heated.
[gcode_macro UNLOAD_FILAMENT]
description: Unload filament with anti-ringing extract sequence — pause-aware.
gcode:
    {% set extruder_temp = params.EXTRUDER_TEMP|default(220)|int %}
    {% set is_paused = printer.pause_resume.is_paused %}

    {% if is_paused %}
        {% if not printer.extruder.can_extrude %}
            RESPOND TYPE=error MSG="UNLOAD_FILAMENT: extruder too cold"
        {% else %}
            G91
            G1 E100 F300
            G1 E-15 F3000
            G1 E-22.4700 F2400
            G1 E-6.4200 F1200
            G1 E-3.2100 F720
            G1 E5.0000 F356
            G1 E-5.0000 F384
            G1 E5.0000 F412
            G1 E-5.0000 F440
            G1 E5.0000 F467
            G1 E-5.0000 F495
            G1 E5.0000 F523
            G1 E-5.0000 F3000
            G1 E-15 F3000
            G90
            RESPOND TYPE=command MSG="Filament unloaded - insert new filament then call LOAD_FILAMENT"
        {% endif %}
    {% else %}
        SAVE_GCODE_STATE NAME=unload_filament_state
        M109 S{extruder_temp}
        G91
        G1 E100 F300
        G1 E-15 F3000
        G1 E-22.4700 F2400
        G1 E-6.4200 F1200
        G1 E-3.2100 F720
        G1 E5.0000 F356
        G1 E-5.0000 F384
        G1 E5.0000 F412
        G1 E-5.0000 F440
        G1 E5.0000 F467
        G1 E-5.0000 F495
        G1 E5.0000 F523
        G1 E-5.0000 F3000
        G1 E-15 F3000
        M104 S0
        RESTORE_GCODE_STATE NAME=unload_filament_state
    {% endif %}
