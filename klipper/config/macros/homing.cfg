# ═══════════════════════════════════════════════════════════════════════
# HOMING — CoreXY, mandatory order Y → X → Z
#
# ⚠️ CRITICAL : axis order MUST be Y → X → Z on the Ender 5 Max.
#    Reversing Y and X causes a MECHANICAL CRASH (gantry corner hits
#    the chassis). DO NOT swap the order without thorough mechanical
#    review. Inherited verbatim from v1's homing.cfg.
#
# How `homing_override` works:
#   - Klipper intercepts every G28 call (bare or with X/Y/Z args).
#   - The gcode block below runs INSTEAD of Klipper's default homing.
#   - 'X' / 'Y' / 'Z' in `params` reflect what the user wrote.
#   - With no axis arg ("G28") all three branches run -> Y, then X, then Z.
#
# Z homing in v2 (pre-Eddy):
#   X and Y use physical endstops (!PA11, !PA12) — fast, reliable, no
#   current tweaking needed.
#   Z uses TMC sensorless (the temporary stand-in for the Eddy probe
#   that lands in Phase 6). The motor stalls against the bed —
#   physically safe IF current is lowered first. We drop run_current
#   to 0.4 A for the homing move, then restore to 0.8 A.
#   With Eddy installed (Phase 6) we'll switch [stepper_z]'s
#   endstop_pin to `probe:z_virtual_endstop` and rip out the
#   current dance.

[homing_override]
axes: xyz
set_position_z: 0
gcode:
    G90
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

    # Initial Z clearance move (30 mm bed descent) so X/Y homing can't
    # drag anything across the bed. NB: E5M is moving-bed CoreXY — Z+
    # means the BED descends 30 mm; the toolhead does NOT rise (see
    # docs/memos/z_kinematics.md). set_position_z: 0 above lets us
    # issue this move even if Z was never homed.
    #
    # Previous attempts to skip this lift ended with the nozzle dragging
    # on the bed during X/Y homing. The LDC1612 can read at 30 mm bed
    # distance even if it's noisier than at 5 mm — the scan in the Z
    # branch below will still trigger as the bed approaches z_offset
    # (=2.5 mm in eddy.cfg, well inside the cal range).
    G1 Z30 F600

    # ─── Y axis (must be homed BEFORE X — see header warning) ────────
    # NB: the condition includes 'X' in params so that "G28 X" alone
    # still homes Y first. This enforces the Y→X mechanical ordering
    # at the Klipper level, not just by user convention.
    {% if home_all or 'X' in params or 'Y' in params %}
        G28 Y
        G1 Y400 F2400          ; park at the back so we don't re-trigger Y
    {% endif %}

    # ─── X axis (must be homed AFTER Y) ──────────────────────────────
    {% if home_all or 'X' in params %}
        G28 X
        G1 X380 F2400          ; park near the right edge
    {% endif %}

    # ─── Z axis (via BTT Eddy probe + precision correction) ──────────
    {% if home_all or 'Z' in params %}
        # Move to bed center for Z homing. With the Eddy probe at
        # x_offset=22, y_offset=0 (probe is +22 mm in X from nozzle),
        # parking the nozzle at X=200, Y=200 puts the probe at X=222,
        # Y=200 — still well within the 400x400 bed.
        G0 X200 Y200 F6000

        # Raw scan-based Z home — bed rises until LDC frequency matches
        # z_offset (=2.5 mm) per the calibration table.
        G28 Z

        # Lift before PROBE: after G28 Z, kinematic Z = z_offset = 2.5,
        # which means the probe is exactly AT its trigger height. The
        # next PROBE command's safety check (`Probe triggered prior to
        # movement`) refuses to start from a triggered state. So lift
        # to Z=10 first — clearly above the trigger range — then PROBE
        # descends fresh. BTT's canonical setup gets this lift "for
        # free" via safe_z_home.z_hop; we have to do it explicitly.
        G1 Z10 F600

        # Raw G28 Z is documented inaccurate (~0.05-0.25 mm scatter per
        # BTT issue #109). Run a precise multi-sample PROBE at the same
        # XY and apply a SET_GCODE_OFFSET correction so the reported Z
        # matches reality.
        # NB: we do this INSIDE homing_override (not in a [gcode_macro
        # G28] wrapper) because a G28 macro wrapper recurses against
        # our `G28 Y` / `G28 X` / `G28 Z` literals here. See
        # https://github.com/bigtreetech/Eddy/blob/master/sample-bigtreetech-eddy-homing.cfg
        # which uses [safe_z_home] (no G28 literals) and so doesn't hit
        # this recursion.
        PROBE
        SET_Z_FROM_PROBE

        RESPOND TYPE=command MSG="G28 Z: scan + PROBE-corrected (Z=5 after lift)."
    {% endif %}


# ─── Post-scan precision correction macros ───────────────────────────
# Called from inside the homing_override Z branch above. Read the last
# PROBE result and apply a SET_GCODE_OFFSET so the kinematic Z reported
# by Klipper matches the precise probe measurement, not the rough scan
# trigger.

[gcode_macro SET_Z_FROM_PROBE]
gcode:
    {% set cf = printer.configfile.settings %}
    SET_GCODE_OFFSET_ORIG Z={printer.probe.last_z_result - cf['probe_eddy_current btt_eddy'].z_offset + printer["gcode_macro SET_GCODE_OFFSET"].runtime_offset}
    G90
    G1 Z5 F600                  ; safe lift after correction (E5M uses
                                ; homing_override, not safe_z_home —
                                ; literal 5 mm replaces BTT's reference
                                ; to safe_z_home.z_hop)

[gcode_macro SET_GCODE_OFFSET]
rename_existing: SET_GCODE_OFFSET_ORIG
variable_restored: False
variable_runtime_offset: 0
gcode:
    SET_GCODE_OFFSET_ORIG { rawparams }
