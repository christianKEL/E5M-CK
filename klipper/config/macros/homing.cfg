# ═══════════════════════════════════════════════════════════════════════
# HOMING — CoreXY, mandatory order Y → X → Z
#
# ⚠️ CRITICAL : axis order MUST be Y → X → Z on the Ender 5 Max.
#    Reversing Y and X causes a MECHANICAL CRASH (gantry corner hits
#    the chassis). DO NOT swap the order without thorough mechanical
#    review. Inherited verbatim from v1's homing.cfg.
#
# How `homing_override` works:
#   - Klipper intercepts every G28 call (bare or with X/Y/Z args).
#   - The gcode block below runs INSTEAD of Klipper's default homing.
#   - 'X' / 'Y' / 'Z' in `params` reflect what the user wrote.
#   - With no axis arg ("G28") all three branches run -> Y, then X, then Z.
#
# Z homing in v2 (pre-Eddy):
#   X and Y use physical endstops (!PA11, !PA12) — fast, reliable, no
#   current tweaking needed.
#   Z uses TMC sensorless (the temporary stand-in for the Eddy probe
#   that lands in Phase 6). The motor stalls against the bed —
#   physically safe IF current is lowered first. We drop run_current
#   to 0.4 A for the homing move, then restore to 0.8 A.
#   With Eddy installed (Phase 6) we'll switch [stepper_z]'s
#   endstop_pin to `probe:z_virtual_endstop` and rip out the
#   current dance.

[homing_override]
axes: xyz
set_position_z: 0
gcode:
    G90
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

    # Initial Z clearance move (30 mm bed descent) so X/Y homing can't
    # drag anything across the bed. NB: E5M is moving-bed CoreXY — Z+
    # means the BED descends 30 mm; the toolhead does NOT rise (see
    # docs/memos/z_kinematics.md). set_position_z: 0 above lets us
    # issue this move even if Z was never homed.
    #
    # Previous attempts to skip this lift ended with the nozzle dragging
    # on the bed during X/Y homing. The LDC1612 can read at 30 mm bed
    # distance even if it's noisier than at 5 mm — the scan in the Z
    # branch below will still trigger as the bed approaches descend_z
    # (=2.5 mm in eddy.cfg, well inside the cal range).
    G1 Z30 F600

    # ─── Y axis (must be homed BEFORE X — see header warning) ────────
    # NB: the condition includes 'X' in params so that "G28 X" alone
    # still homes Y first. This enforces the Y→X mechanical ordering
    # at the Klipper level, not just by user convention.
    {% if home_all or 'X' in params or 'Y' in params %}
        G28 Y
        G1 Y400 F2400          ; park at the back so we don't re-trigger Y
    {% endif %}

    # ─── X axis (must be homed AFTER Y) ──────────────────────────────
    {% if home_all or 'X' in params %}
        G28 X
        G1 X380 F2400          ; park near the right edge
    {% endif %}

    # ─── Z axis (via BTT Eddy probe scan) ────────────────────────────
    {% if home_all or 'Z' in params %}
        # Move to bed center for Z homing. With the Eddy probe at
        # x_offset=22, y_offset=0 (probe is +22 mm in X from nozzle),
        # parking the nozzle at X=200, Y=200 puts the probe at X=222,
        # Y=200 — still well within the 400x400 bed.
        G0 X200 Y200 F6000

        # Scan-based Z home — bed rises until LDC frequency matches
        # descend_z (=2.5 mm) per the calibration table. ~30 µm scatter
        # is acceptable here; precision Z=0 for first layer comes from
        # PROBE METHOD=tap later (after PROBE_EDDY_CURRENT_TAP_CALIBRATE),
        # not from a post-scan correction.
        G28 Z

        # Lift to a safe Z after the trigger so subsequent moves don't
        # graze the bed and the probe isn't camped on its trigger height.
        G1 Z5 F600

        RESPOND TYPE=command MSG="G28 Z: scan homed (Z=5 after lift). Use PROBE METHOD=tap for precision Z=0."
    {% endif %}


# ─── PRECISE_HOME — tap-refined Z=0 after the standard scan-based G28 ─
# Named PRECISE_HOME rather than PRECISE_HOME because Klipper rejects
# macro names starting with G followed by a digit (collides with the
# gcode parser).
# The scan-mode G28 Z above places Z=0 within ~±50 µm of true bed
# contact. That's fine for normal moves, but for bed_mesh accuracy we
# want better: a follow-up PROBE METHOD=tap gives ~±5 µm, and
# SET_KINEMATIC_POSITION Z=0 at the tap contact shifts the kinematic
# frame so the next BED_MESH_CALIBRATE builds on the refined reference.
#
# Why SET_KINEMATIC_POSITION rather than SET_GCODE_OFFSET: gcode_offset
# is applied only when slicer-emitted G1 commands are parsed. bed_mesh
# reads positions in raw kinematic coordinates during its probing,
# bypassing the gcode layer, so a gcode_offset wouldn't reach it.
# Shifting the kinematic frame does.
#
# Prerequisite: nozzle hot enough to tap (>= min_extrude_temp, default
# 170 C). Caller is responsible for the warm-up. If the printer is not
# homed yet, this macro will G28 first.
#
# Side effect: any subsequent G28 (or G28 Z) re-runs scan-based homing
# and resets Z=0 back to the scan reference, undoing this refinement.
# So PRECISE_HOME should be called LAST in the homing chain, not before
# operations that re-home.
[gcode_macro PRECISE_HOME]
description: G28 followed by tap-precision Z=0 refinement (default tap at bed center).
gcode:
    {% set x = params.X|default(200)|float %}
    {% set y = params.Y|default(200)|float %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X{x} Y{y} F6000
    G1 Z5 F600
    PROBE METHOD=tap
    SET_KINEMATIC_POSITION Z=0
    G91
    G1 Z5 F600
    G90
    RESPOND TYPE=command MSG="PRECISE_HOME: kinematic Z=0 refined by tap at ({x|int}, {y|int})"
