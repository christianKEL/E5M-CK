# Sensorless homing macros.
#
# All three axes use TMC2209 virtual_endstop (StallGuard). Sensorless
# homing requires:
#   - lowering motor current temporarily during homing
#   - moving away from the endstop before the actual homing move
#     so StallGuard registers clear
#
# G28 is overridden to wrap _HOME_AXIS for each requested axis.

[gcode_macro G28]
rename_existing: G28.1
gcode:
    {% set axes = rawparams|upper|replace(' ', '') %}
    {% if axes == '' %}
        _HOME_X
        _HOME_Y
        _HOME_Z
    {% else %}
        {% if 'X' in axes %}_HOME_X{% endif %}
        {% if 'Y' in axes %}_HOME_Y{% endif %}
        {% if 'Z' in axes %}_HOME_Z{% endif %}
    {% endif %}


[gcode_macro _HOME_X]
description: Sensorless home X via TMC2209 StallGuard.
gcode:
    {% set RUN_CUR  = printer.configfile.settings['tmc2209 stepper_x'].run_current %}
    {% set HOME_CUR = 0.5 %}                # lower current = more sensitive stall detect
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
    G4 P200                                  # let current settle
    G28.1 X
    G4 P200                                  # let StallGuard registers clear
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR}


[gcode_macro _HOME_Y]
description: Sensorless home Y via TMC2209 StallGuard.
gcode:
    {% set RUN_CUR  = printer.configfile.settings['tmc2209 stepper_y'].run_current %}
    {% set HOME_CUR = 0.5 %}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
    G4 P200
    G28.1 Y
    G4 P200
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CUR}


[gcode_macro _HOME_Z]
description: Sensorless home Z via TMC2209 (low current, slow approach).
# WARNING: no bed probe is wired in Phase 3. Z homing uses StallGuard
# on the Z motors, hitting the bed. Pre-heat the nozzle just enough to
# avoid filament drag (140 C), but do NOT push hard.
gcode:
    {% set RUN_CUR  = printer.configfile.settings['tmc2209 stepper_z'].run_current %}
    {% set HOME_CUR = 0.4 %}
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={HOME_CUR}
    G4 P200
    G28.1 Z
    G4 P200
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={RUN_CUR}
