# ═══════════════════════════════════════════════════════════════════════
# EDDY_DRIFT_CALIBRATE — fully automated temperature drift calibration
# for the BTT Eddy probe coil.
#
# One-click macro that:
#   1. Turns the light on (user can watch).
#   2. Homes (Y -> X -> Z via our homing_override) and centers the
#      toolhead at X200 Y200 Z10.
#   3. Heats the nozzle to 250 C and the bed to 100 C (no M109/M190
#      blocking wait — the calibration's own coil-temp threshold loop
#      naturally lets the heaters ramp up while it samples).
#   4. Spawns a detached Python watchdog (eddy_drift_watchdog.py) that
#      polls Moonraker for the coil thermistor (NOT the RP2040 MCU die
#      temperature — different sensor).
#   5. Starts TEMPERATURE_PROBE_CALIBRATE METHOD=tap. With METHOD=tap
#      (mainline klipper commit 4cc47cf5), Klipper auto-probes at each
#      STEP=2 C of coil rise; no manual paper-feel between samples.
#
# Watchdog behavior — see klipper/scripts/eddy_drift_watchdog.py:
#   - Polls every 10 s.
#   - If the coil hasn't risen for 10 min while in_calibration=True,
#     posts TEMPERATURE_PROBE_COMPLETE to finalize the drift table with
#     whatever samples were collected (typical when the bed plateaus
#     below TARGET because of radiation losses).
#   - Once in_calibration goes False (TARGET reached, COMPLETE, or
#     ABORT), posts TURN_OFF_HEATERS, drops the light, and emits a
#     RESPOND telling the user the cal is done and SAVE_CONFIG is the
#     next step.
#   - Hard 90-min cap as a safety net.
#
# Persistence: this macro does NOT run SAVE_CONFIG. The drift table
# lives in printer.cfg's autosave block, and SAVE_CONFIG restarts
# Klipper. We leave that to the user to invoke when they want the
# restart.
#
# Re-running: safe. The watchdog detects in_calibration=False on its
# first poll and exits quickly without doing anything.
# ═══════════════════════════════════════════════════════════════════════


[gcode_shell_command start_eddy_drift_watchdog]
command: /usr/data/e5m-ck/bin/start_eddy_drift_watchdog.sh
timeout: 5.0
verbose: True


[gcode_macro EDDY_DRIFT_CALIBRATE]
description: Auto BTT Eddy coil temperature drift calibration (bed @ 100, nozzle @ 250, METHOD=tap).
gcode:
    SET_PIN PIN=light_pin VALUE=1
    RESPOND TYPE=command MSG="EDDY_DRIFT_CALIBRATE: homing + centering..."
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X200 Y200 Z10 F6000
    RESPOND TYPE=command MSG="EDDY_DRIFT_CALIBRATE: heating bed=100, nozzle=250..."
    M104 S250
    M140 S100
    RUN_SHELL_COMMAND CMD=start_eddy_drift_watchdog
    RESPOND TYPE=command MSG="EDDY_DRIFT_CALIBRATE: starting (~25-35 min). Watchdog will auto-cleanup."
    TEMPERATURE_PROBE_CALIBRATE PROBE=btt_eddy TARGET=100 STEP=2 METHOD=tap
