# ═══════════════════════════════════════════════════════════════════════
# BTT Eddy USB — Klipper mainline configuration (E5M-CK v2 minimal)
#
# Hardware:
#   - BTT Eddy probe over USB (RP2040 + LDC1612 inductive sensor)
#   - Mounted at x_offset=22, y_offset=0 from the nozzle (post-29/04/2026
#     remount — signal/noise 2× better than the original x=38, y=6 mount)
#
# Firmware:
#   - Klipper v0.13.0 RP2040 build (klipper/binaries/rp2040/btteddy.uf2)
#   - Compiled in Codespace; see commit 1c51365 for details
#
# Documentation:
#   - https://www.klipper3d.org/Eddy_Probe.html
#
# This is the MINIMAL viable config. It does NOT include v1's Klipper bug
# workarounds (samp_retract_dist=0 tap bug, gcode_offset cumul bug). Those
# will be added IF/WHEN we hit them during real prints. Keep this file
# small to stay close to upstream Klipper expectations.

# ─── Eddy MCU ────────────────────────────────────────────────────────
# The serial-by-id below is a placeholder — Phase 6.5 will replace it
# with the actual usb-Klipper_rp2040_XXXX-if00 path detected once the
# Eddy is flashed and plugged in.
[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_PLACEHOLDER-if00
restart_method: command


# ─── Eddy MCU temperature ────────────────────────────────────────────
# The Eddy's RP2040 reports its die temperature. Used for tap thermal
# compensation later (drift_calibration) — for now just a sensor.
[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 0
max_temp: 100


# ─── The probe itself ────────────────────────────────────────────────
[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 22.0
y_offset: 0.0
# The two tap parameters below are populated AFTER calibration:
#   tap_threshold      : from PROBE_EDDY_CURRENT_TAP_CALIBRATE
#   tap_z_offset       : adjusted manually after first print test
# Without them tap won't work — scan-mode bed mesh still does.
# Uncomment + tune in Phase 6.6 cal sequence:
# tap_threshold: 28
# tap_z_offset: 0.0


# ─── Eddy coil temperature (for drift compensation) ──────────────────
# Reads a thermistor wired on the Eddy board (gpio26). If your Eddy
# doesn't have one wired, comment this out and Klipper will use the
# RP2040 die temp from temperature_sensor btt_eddy_mcu instead.
[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2
