# ═══════════════════════════════════════════════════════════════════════
# BTT Eddy USB — Klipper mainline configuration (E5M-CK v2 minimal)
#
# Hardware:
#   - BTT Eddy probe over USB (RP2040 + LDC1612 inductive sensor)
#   - Mounted at x_offset=22, y_offset=0 from the nozzle (post-29/04/2026
#     remount — signal/noise 2× better than the original x=38, y=6 mount)
#
# Firmware:
#   - Klipper master RP2040 build (v0.13.0-658-gbd09e0170, May 2026)
#     at klipper/binaries/rp2040/btteddy.uf2
#   - Bumped from v0.13.0 to master for tap support
#     (PROBE_EDDY_CURRENT_TAP_CALIBRATE landed post-v0.13.0). The matching
#     host-side c_helper.so was cross-compiled with the Ingenic toolchain.
#
# Documentation:
#   - https://www.klipper3d.org/Eddy_Probe.html
#
# This is the MINIMAL viable config. It does NOT include v1's Klipper bug
# workarounds (samp_retract_dist=0 tap bug, gcode_offset cumul bug). Those
# will be added IF/WHEN we hit them during real prints. Keep this file
# small to stay close to upstream Klipper expectations.

# ─── Eddy MCU ────────────────────────────────────────────────────────
# Serial-by-id is printer-specific (derived from the RP2040 chip ID at
# firmware build time). Detected by installs/install_eddy.sh on first
# flash. Same chip ID as v1 — these Eddies persist their ID across
# reflashes since CONFIG_USB_SERIAL_NUMBER_CHIPID=y in the firmware.
[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_50445059303E9B1C-if00
restart_method: command


# ─── Eddy MCU temperature ────────────────────────────────────────────
# The Eddy's RP2040 reports its die temperature. Used for tap thermal
# compensation later (drift_calibration) — for now just a sensor.
[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 0
max_temp: 100


# ─── The probe itself ────────────────────────────────────────────────
[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 22.0
y_offset: 0.0
# Scan target Z (mm). MUST lie strictly inside the calibrated Z range
# (which after PROBE_EDDY_CURRENT_CALIBRATE typically covers 0.05-4.05
# mm). If descend_z is at or below the cal minimum, Klipper's
# height_to_freq raises "Invalid probe_eddy_current height" and G28 Z
# fails BEFORE any motion — verified the hard way on 2026-05-19 with
# z_offset: 0.0.
#
# 2.5 is the BTT-canonical default
# (sample-bigtreetech-eddy-homing.cfg). After a successful G28 Z the
# nozzle ends up at Z=2.5 (synthetic).
#
# NB: in master Klipper this option was renamed from `z_offset` to
# `descend_z` to disambiguate from the generic probe `z_offset`
# (nominal nozzle-to-bed distance, set by PROBE_CALIBRATE). Using the
# old name still works but emits a deprecation warning.
descend_z: 2.5

# ─── Values from PROBE_EDDY_CURRENT_CALIBRATE + TAP_CALIBRATE ────────
# Captured from the live printer.cfg autosave block on 2026-05-20.
# Klipper's autosave at the bottom of printer.cfg will override these
# if a future re-cal stores different values; in that case, re-run the
# sync (see docs/operations/eddy.md) to update this file.

# LDC drive current chosen by LDC_CALIBRATE_DRIVE_CURRENT (Step 1, cold,
# probe at ~20 mm above bed).
reg_drive_current: 15

# Tap detection threshold from PROBE_EDDY_CURRENT_TAP_CALIBRATE
# TAP=guess -> refine -> verify (Step 3, cold, nozzle at 200,200).
# In master Klipper this is in raw frequency-delta units (~6931), not
# the older 0-50 normalized scale used in v1.
tap_threshold: 6931.388

# tap_z_offset is the offset between physical contact and reported Z=0.
# Klipper master defaults to 0; tune manually after first-layer print.
# tap_z_offset: 0.0

# Frequency -> Height lookup table from PROBE_EDDY_CURRENT_CALIBRATE
# (Step 2, cold cal, bed at ~22 °C, calibration_temp ~33 °C — see
# [temperature_probe btt_eddy] below). Covers Z = 0.05-4.05 mm.
# stddev reported during cal: ~85 (raw frequency units; "good" is < 100).
calibrate:
	0.049912:3273773.860,0.089842:3272837.770,0.129772:3271005.013,
