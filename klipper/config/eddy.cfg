# ─── Eddy coil temperature (for drift compensation) ──────────────────
# Reads a thermistor wired on the Eddy board (gpio26). If your Eddy
# doesn't have one wired, comment this out and Klipper will use the
# RP2040 die temp from temperature_sensor btt_eddy_mcu instead.
[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2

# Coil temperature recorded at the time of PROBE_EDDY_CURRENT_CALIBRATE.
# Used as the reference temp for thermal-drift compensation if/when we
# run TEMPERATURE_PROBE_CALIBRATE. Synced from autosave on 2026-05-20.
calibration_temp: 33.387652
