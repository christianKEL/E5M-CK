# ═══════════════════════════════════════════════════════════════════════
# Input shaper — Ender 5 Max v2
#
# Loaded via [include input_shaper.cfg] in printer.cfg.
#
# Backed by two custom Klipper extras (in this repo at klipper/extras/):
#   accel_chip_proxy.py     synthetic chip that resonance_tester targets
#   adxl345_creality.py     speaks the stock-firmware on-wire dialect
# Both are staged into /usr/data/e5m-ck/klipper/klippy/extras/ by
# installs/install_klipper.sh (the /tmp/klipper_extras_*.py pipeline).
#
# Why this needs a custom bridge: the ADXL345 lives on the stock Creality
# 2023 nozzle-MCU's SPI bus; mainline's [adxl345] driver can't speak that
# firmware's protocol (3-arg query_adxl345, 5-byte sample packing, etc.).
# Reflashing the nozzle MCU would break the factory_reset rollback path.
# See klipper/extras/accel_chip_proxy.py header + docs/operations/input_shaper.md.
#
# Rollback: comment out [accel_chip_proxy] and [resonance_tester] below
# and restart Klipper. The .py modules stay on disk but are dormant
# (Klipper only loads modules referenced by an active config section).
# ═══════════════════════════════════════════════════════════════════════


# ─── Accelerometer (Creality stock-firmware ADXL345, via proxy) ──────
# All SPI pins live on the nozzle MCU. CS / SCLK / MOSI / MISO are
# wired to PA4 / PA5 / PA7 / PA6 — these are PHYSICAL board pins, not
# free GPIO. axes_map "x,-z,y" matches the ADXL's physical orientation
# on the E5M print head (validated against v1's measurements).
[accel_chip_proxy]
accel_use_chip:                adxl345
adxl345_cs_pin:                nozzle_mcu:PA4
adxl345_spi_speed:             5000000
adxl345_spi_software_sclk_pin: nozzle_mcu:PA5
adxl345_spi_software_mosi_pin: nozzle_mcu:PA7
adxl345_spi_software_miso_pin: nozzle_mcu:PA6
adxl345_axes_map:              x,-z,y


# ─── Auto-apply recommended max_accel after MEASURE_AXIS Y ───────────
# Klipper's SHAPER_CALIBRATE auto-saves [input_shaper] but never touches
# [printer] max_accel — it just prints "suggested max_accel <= N" to the
# console. This extras module re-fits the latest X+Y CSVs, takes the
# min of the two recommendations, applies it at runtime via
# SET_VELOCITY_LIMIT, and rewrites the max_accel: line in the LIVE
# /usr/data/printer_data/config/printer.cfg in place.
#
# Invoked automatically at the end of MEASURE_AXIS AXIS=Y (see
# macros/input_shaper.cfg). Can also be called manually:
#   APPLY_SHAPER_MAX_ACCEL
#
# Module: klipper/extras/shaper_max_accel_apply.py
# (staged by installs/install_klipper.sh + verified by install_input_shaper.sh)
[shaper_max_accel_apply]


# ─── Resonance tester ────────────────────────────────────────────────
# probe_points: center of bed at Z=10. With our moving-bed CoreXY the
# accelerometer rides the toolhead (fixed in Z); Z=10 here is the
# bed-to-toolhead distance at which the sweep runs — close enough that
# the toolhead inertia matches typical print conditions.
#
# accel_per_hz: 50 (Klipper default is 75). Carried from v1; the X belt
# occasionally exceeds TMC stall threshold at 75 during the high-freq
# end of the sweep on this machine. 50 is the conservative choice;
# raise to 75 only after confirming TMC current headroom.
[resonance_tester]
accel_chip:    accel_chip_proxy
probe_points:  200, 200, 10
accel_per_hz:  50


# ─── Input shaper ────────────────────────────────────────────────────
# Intentionally NOT defined in this file. [input_shaper] is a Klipper
# "unique" section — if it lives in an included file AND SAVE_CONFIG
# tries to autosave it, Klipper raises "conflicts with included value".
# The canonical pattern is to let SAVE_CONFIG own [input_shaper] entirely
# via the autosave block at the bottom of the LIVE printer.cfg.
#
# Workflow:
#   1. MEASURE_AXIS AXIS=X   — Klipper recommends shaper_type_x + freq
#   2. MEASURE_AXIS AXIS=Y   — same for Y
#   3. SAVE_CONFIG           — writes [input_shaper] to the autosave block
#                              at the bottom of LIVE printer.cfg
#
# To re-sync the calibrated values back into the repo (so a fresh
# `sync.sh` reproduces the calibrated state): on a fresh printer, just
# re-run MEASURE_AXIS X/Y + SAVE_CONFIG — the cal is fast and deterministic.
# If you want a versioned record of the last-calibrated values, copy them
# from the live printer.cfg autosave block into a comment block at the
# bottom of THIS file. Do NOT make them a regular [input_shaper] section
# here — that would re-introduce the conflict.
