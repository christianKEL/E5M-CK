# ═══════════════════════════════════════════════════════════════════════
# TMC status integration for GuppyScreen.
#
# Activates GuppyScreen's "TMC Metrics" panel — live, read-only view of
# each TMC2209 driver's state: DRV_STATUS bits (open-load, short-circuit,
# overtemperature pre-warning, stallguard active), RMS current, stallguard
# result, CoolStep params, PWM autoscaling state, etc.
#
# Wiring:
#   - Two Python extras (guppy_module_loader.py, tmcstatus.py) are copied
#     from /usr/data/guppyscreen/k1_mods/ into klippy/extras/ by
#     installs/install_tmc_status.sh. They ship with GuppyScreen — we
#     don't vendor them in this repo.
#   - guppy_module_loader.py registers two no-arg commands:
#       _GUPPY_LOAD_MODULE   SECTION=<name>   →  load that Klipper object
#       _GUPPY_UNLOAD_MODULE SECTION=<name>   →  drop it from printer.objects
#     GuppyScreen calls these when its TMC panel opens/closes, so the
#     tmcstatus object is only computed when the panel is visible.
#   - tmcstatus.py implements the `tmcstatus` Klipper object that the
#     binary subscribes to via Moonraker WebSocket (printer.tmcstatus.*).
#     get_status() iterates configured tmc* sections and reports register
#     values per stepper.
#
# Scope: STATUS-ONLY (Phase A). TMC Autotune (Phase B) is deferred until
# we have stepper motor R/L specs — see docs/operations/tmc.md if added.
# That phase would require installing andrewmcgr/klipper_tmc_autotune
# and configuring [autotune_tmc <stepper>] sections per motor, which
# touches run-current and stallguard threshold — incompatible with our
# tuned sensorless X/Y homing until the motors are properly identified.
#
# Side effects of THIS file alone: none. The `tmcstatus` object only
# spins up when GuppyScreen explicitly loads it, and reads registers
# the TMC driver already exposes. No motion, no current change.

[guppy_module_loader]


# ─── restart_guppyscreen — full Guppy reset for "clean OFF" semantics ─
# GuppyScreen's Settings toggle for TMC Metrics is asymmetric: turning
# it ON loads tmcstatus and renders the panel; turning it OFF unloads
# the module server-side but the LVGL panel keeps showing the last
# fetched frame (Guppy doesn't bind redraws to empty-payload updates).
# Restarting Guppy is the only clean way to get the screen back to its
# pre-ON layout — at restart, guppyconfig.json is re-read fresh, and
# since the TMC Metrics enable flag isn't persisted there (it's in-
# memory only — verified by reading the live config), the tile
# disappears.
#
# This shell command is wired in TWO places:
#   1. Automatically — our vendored guppy_module_loader.py (in
#      klipper/extras/) fires it inside cmd_guppy_unload_module()
#      whenever GuppyScreen sends _GUPPY_UNLOAD_MODULE SECTION=tmcstatus
#      (i.e. the user toggled OFF in Settings). The user gets a clean
#      "back to before ON" screen with no extra manual step.
#   2. Manually — the RESTART_GUPPYSCREEN macro below, callable from
#      Fluidd's console, for the case where the screen is in some other
#      stuck state and a full reset is needed.
#
# The shell command itself just invokes restart_guppyscreen.sh, which
# detaches a 300 ms-delayed restart so the originating gcode response
# can return to Guppy before the process is killed (otherwise Guppy
# logs a phantom "command timed out").
#
# Side effect: blanks the touch panel for ~2-3 s while supervise-daemon
# respawns the binary. Klipper, Moonraker, and the printer itself are
# unaffected — only the touch UI process cycles.
[gcode_shell_command restart_guppyscreen]
command: /usr/data/e5m-ck/bin/restart_guppyscreen.sh
timeout: 5.0
verbose: True

[gcode_macro RESTART_GUPPYSCREEN]
description: Restart the GuppyScreen touch UI (same as Guppy's own "Restart Guppy" button).
gcode:
    RESPOND TYPE=command MSG="Restarting GuppyScreen — screen will blank for ~3 s..."
    RUN_SHELL_COMMAND CMD=restart_guppyscreen
