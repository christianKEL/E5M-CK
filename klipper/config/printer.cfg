# E5M-CK printer.cfg (v2, mainline-compatible)
#
# Target hardware: Creality Ender 5 Max ("Nebula Pad" SoC: Ingenic X2000)
#
# Stock MCU firmwares are kept as-is on the 3 GD32 chips:
#   - main mcu     CR4NS200323C10         (GD32F303RET6)  /dev/ttyS1
#   - nozzle_mcu   CR-NOZZLE_V21          (GD32F303CBT6)  /dev/ttyS7
#   - leveling_mcu CR-K1-MAX-LEVELING-V1  (GD32E230F8P6)  /dev/ttyS6
#   - host rpi-mcu klipper_mcu (Linux)    via /tmp/klipper_host_mcu
#
# Mainline klippy can drive these firmwares for standard ops (steppers,
# heaters, fans, GPIO) since the Creality fork only ADDS commands; it
# doesn't change the standard protocol.
#
# Out of scope for now (deferred to later phases):
#   - prtouch_v2 / hx711s   : Creality strain-gauge bed probe -> need to
#                             replace with BTT Eddy probe (Phase 6).
#   - accel_chip_proxy      : Creality ADXL proxy -> needs the patch
#                             that lands in Phase 10. No Input Shaping
#                             until then.
#   - bl24c16f, filter,     : Creality custom modules; not needed for
#     dirzctl                 basic motion / printing.
#   - BED_MESH_CALIBRATE    : Requires a working probe (Phase 6).
#                             [bed_mesh] section is kept so config loads,
#                             but don't run CALIBRATE yet.

[include macros/homing.cfg]
[include macros/start_end.cfg]
[include macros/util.cfg]


# ---------------------------------------------------------------------------
# MCUs
# ---------------------------------------------------------------------------
[mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS7
baud: 230400
restart_method: command

[mcu leveling_mcu]
serial: /dev/ttyS6
baud: 230400
restart_method: command

[mcu rpi]
serial: /tmp/klipper_host_mcu


# ---------------------------------------------------------------------------
# Kinematics (CoreXY, 400x400x400 build volume)
# ---------------------------------------------------------------------------
[printer]
kinematics: corexy
max_velocity: 500
max_accel: 5000
max_accel_to_decel: 5000
max_z_velocity: 30
max_z_accel: 300
square_corner_velocity: 5.0

[force_move]
enable_force_move: true

[idle_timeout]
timeout: 600


# ---------------------------------------------------------------------------
# Steppers — X / Y use sensorless homing via TMC2209 diag pins.
# Z uses tmc2209 virtual_endstop too (sensorless on Z).
# Values inherited from the stock printer.cfg.
# ---------------------------------------------------------------------------
[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 32
rotation_distance: 63.874
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 400
position_min: -5
position_max: 406
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PB12
uart_address: 3
interpolate: True
run_current: 2.0
sense_resistor: 0.150
stealthchop_threshold: 0
diag_pin: ^PB10
driver_SGTHRS: 80

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 32
rotation_distance: 64.024
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 401
position_min: -1
position_max: 401
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PB13
uart_address: 3
interpolate: True
run_current: 2.0
sense_resistor: 0.150
stealthchop_threshold: 0
diag_pin: ^PB11
driver_SGTHRS: 80

[stepper_z]
step_pin: PB6
dir_pin: PB5
enable_pin: !PC3
microsteps: 32
rotation_distance: 3.9930
gear_ratio: 1:1
endstop_pin: tmc2209_stepper_z:virtual_endstop
position_endstop: 0
position_min: -5
position_max: 406.5

[tmc2209 stepper_z]
uart_pin: PB14
uart_address: 3
interpolate: True
run_current: 0.8
sense_resistor: 0.150
stealthchop_threshold: 0
diag_pin: PB0


# ---------------------------------------------------------------------------
# Extruder (nozzle_mcu)
# ---------------------------------------------------------------------------
[extruder]
max_extrude_only_distance: 1000
max_extrude_cross_section: 80
pressure_advance: 0.04
step_pin: nozzle_mcu:PB5
dir_pin: nozzle_mcu:PB4
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.72
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu:PA0
control: pid
pid_kp: 20.145
pid_ki: 1.919
pid_kd: 52.881
min_temp: 0
max_temp: 320

[tmc2209 extruder]
uart_pin: nozzle_mcu:PB10
uart_address: 3
run_current: 0.6
sense_resistor: 0.15
stealthchop_threshold: 0

[verify_heater extruder]


# ---------------------------------------------------------------------------
# Bed
# ---------------------------------------------------------------------------
[heater_bed]
heater_pin: PA4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp: 30
pid_ki: 0.075
pid_kd: 800
min_temp: 0
max_temp: 110

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10


# ---------------------------------------------------------------------------
# Fans
# ---------------------------------------------------------------------------
# Hotend (heater) fan — auto-controlled by extruder temp.
[heater_fan nozzle_fan]
pin: !nozzle_mcu:PB3
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.1
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0
heater: extruder
heater_temp: 60.0
fan_speed: 1.0

# Enable pin for the hotend fan board.
[output_pin en_nozzle_fan]
pin: nozzle_mcu:PB7
pwm: False
value: 1.0

# Part-cooling fans (front and back). Controlled via M106 / SET_FAN macros.
[fan_generic fan0]
pin: !nozzle_mcu:PB15
cycle_time: 0.01
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0

[output_pin en_fan0]
pin: nozzle_mcu:PB6
pwm: False
value: 1.0

[fan_generic fan1]
pin: !nozzle_mcu:PA9
cycle_time: 0.01
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0

[output_pin en_fan1]
pin: nozzle_mcu:PB9
pwm: False
value: 1.0

# Mainboard fan (always-on while system runs).
[output_pin MainBoardFan]
pin: !PB1
pwm: False
value: 1.0


# ---------------------------------------------------------------------------
# Sensors
# ---------------------------------------------------------------------------
[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[filament_switch_sensor filament_sensor]
switch_pin: !PC6
pause_on_runout: true


# ---------------------------------------------------------------------------
# LEDs (status indicators on the mainboard)
# ---------------------------------------------------------------------------
[output_pin green_pin]
pin: PA0
value: 0.0

[output_pin red_pin]
pin: PC1
value: 0.0

[output_pin yellow_pin]
pin: PA1
value: 1.0

[output_pin light_pin]
pin: PC0
value: 0.0


# ---------------------------------------------------------------------------
# Print management
# ---------------------------------------------------------------------------
[virtual_sdcard]
path: /usr/data/printer_data/gcodes

[pause_resume]

[display_status]

[exclude_object]


# ---------------------------------------------------------------------------
# Bed mesh CONFIG (calibration disabled until BTT Eddy lands in Phase 6).
# ---------------------------------------------------------------------------
[bed_mesh]
speed: 350
mesh_min: 5, 5
mesh_max: 395, 395
probe_count: 8, 8
fade_start: 3.0
fade_end: 10
fade_target: 0
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: 1


# ---------------------------------------------------------------------------
# Save-config block — Klipper appends auto-saved PID / calibration values
# below this line. DO NOT EDIT manually.
# ---------------------------------------------------------------------------
#*# <---------------------- SAVE_CONFIG ---------------------->
#*# DO NOT EDIT THIS BLOCK OR BELOW. The contents are auto-generated.
