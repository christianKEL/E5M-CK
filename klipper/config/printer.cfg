# E5M-CK printer.cfg (v2, derived from v1's last-known-good)
#
# This file is the v1 working baseline adapted for v2:
#   - same MCU layout, endstops, currents, PIDs, fan pins, LED inverts
#   - kinematics + speeds straight from v1
#   - bed_mesh kept in "scan" form ready for the Eddy probe in Phase 6
#
# Differences vs v1 (intentional):
#   - No `step_pulse_duration` (removed at user's request, May 2026)
#   - [stepper_z] endstop_pin temporarily on tmc2209 virtual_endstop
#     because the Eddy probe is not installed yet. Will switch back to
#     `probe:z_virtual_endstop` in Phase 6 once [probe_eddy_current] lands.
#   - Adds [include macros/*.cfg], [virtual_sdcard], [pause_resume],
#     [display_status], [exclude_object] for Moonraker/Fluidd integration.
#
# Out of scope here (deferred):
#   - prtouch_v2 / hx711s          (Creality strain-gauge bed probe)
#   - accel_chip_proxy             (Creality ADXL — Phase 10 patch)
#   - bl24c16f, filter, dirzctl    (Creality custom modules; unused)
#   - [temperature_sensor mcu_temp] using temperature_mcu (gd32f303xe
#     not supported by mainline klipper module)

[include macros/homing.cfg]
[include macros/start_end.cfg]
[include macros/util.cfg]
[include macros/input_shaper.cfg]
[include macros/eddy_drift.cfg]
[include macros/pause_resume.cfg]
[include eddy.cfg]
[include input_shaper.cfg]
[include tmc.cfg]


# ─── MCUs ─────────────────────────────────────────────────────────
[mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS7
baud: 230400
restart_method: command

[force_move]
enable_force_move: True


# ─── Heater safety ────────────────────────────────────────────────
[verify_heater extruder]

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10


# ─── Printer kinematics (CoreXY, 400x400x400) ─────────────────────
[printer]
kinematics: corexy
max_velocity: 1000
max_accel: 4700
minimum_cruise_ratio: 0.5
max_z_velocity: 30
square_corner_velocity: 5.0
max_z_accel: 300

[idle_timeout]
timeout: 99999999


# ─── MCU deprecation warning filter ───────────────────────────────
# Silences specific deprecated_mcu_code warnings emitted by Klipper
# master at startup. We run master host against the stock Creality
# MCU firmware (mainboard + nozzle board), and that firmware predates
# the STEPPER_STEP_BOTH_EDGE optimization flag. The missing flag is an
# optimization, not a regression — steppers continue to work normally.
#
# Why we don't reflash: keeping the stock firmware is a precondition
# for our factory_reset rollback path. See
# installs/creality_kill.sh + docs/operations/factory_reset.md.
#
# How this works: see klipper/extras/mcu_deprecation_filter.py — it
# monkey-patches configfile.deprecate_mcu_code at load time to drop
# the listed features and pass everything else through.
#
# To restore the warnings: delete this section and restart Klipper.
[mcu_deprecation_filter]
features: STEPPER_STEP_BOTH_EDGE, spi_set_sw_bus
reason: stock Creality MCU firmware preserved for factory_reset rollback


# ─── Steppers ─────────────────────────────────────────────────────
# X / Y use PHYSICAL endstops (mechanical switches at the corners).
# Z uses TMC sensorless temporarily; replaced by `probe:z_virtual_endstop`
# in Phase 6 when the BTT Eddy probe lands.

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 32
rotation_distance: 63.874
endstop_pin: !PA11
position_endstop: 400.5
position_min: -5
position_max: 406
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PB12
uart_address: 3
interpolate: True
run_current: 2.0
sense_resistor: 0.150
stealthchop_threshold: 0
diag_pin: ^PB10
driver_SGTHRS: 80

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 32
rotation_distance: 64.024
endstop_pin: !PA12
position_endstop: 401
position_min: -1
position_max: 401
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PB13
uart_address: 3
interpolate: True
run_current: 2.0
sense_resistor: 0.150
stealthchop_threshold: 0
diag_pin: ^PB11
driver_SGTHRS: 80

[stepper_z]
step_pin: PB6
dir_pin: PB5
enable_pin: !PC3
microsteps: 32
rotation_distance: 3.9930
gear_ratio: 1:1
# Z homing via BTT Eddy probe (see eddy.cfg). probe:z_virtual_endstop
# is provided by [probe_eddy_current btt_eddy]; no position_endstop
# needed — the probe provides the trigger point.
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0
position_max: 406.5
position_min: -2

[tmc2209 stepper_z]
uart_pin: PB14
uart_address: 3
interpolate: True
run_current: 0.8
sense_resistor: 0.150
stealthchop_threshold: 0
diag_pin: PB0


# ─── Filament runout sensor ───────────────────────────────────────
[filament_switch_sensor filament_sensor]
switch_pin: !PC6
pause_on_runout: true


# ─── Extruder ─────────────────────────────────────────────────────
# PID values from PID_CALIBRATE HEATER=extruder TARGET=220 on 2026-05-19.
[extruder]
max_extrude_only_distance: 1000
max_extrude_cross_section: 80
pressure_advance: 0.04
step_pin: nozzle_mcu: PB5
dir_pin: nozzle_mcu: PB4
enable_pin: !nozzle_mcu: PB2
microsteps: 16
rotation_distance: 6.72
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu: PB8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu: PA0
control: pid
pid_kp: 29.576
pid_ki: 2.405
pid_kd: 90.946
min_temp: 0
max_temp: 320

[tmc2209 extruder]
uart_pin: nozzle_mcu: PB10
uart_address: 3
run_current: 0.6
sense_resistor: 0.15
stealthchop_threshold: 0


# ─── Heated bed ───────────────────────────────────────────────────
# PID values from PID_CALIBRATE HEATER=heater_bed TARGET=60 on 2026-05-19.
# Klipper's live autosave block at the bottom of /usr/data/printer_data/config/
# printer.cfg will mirror these — re-run cal + SAVE_CONFIG then sync back here.
[heater_bed]
pwm_cycle_time: 0.3
heater_pin: PA4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp: 50.868
pid_ki: 0.332
pid_kd: 1947.599
min_temp: -30
max_temp: 110


# ─── Fans ─────────────────────────────────────────────────────────
[output_pin MainBoardFan]
pin: !PB1

[heater_fan nozzle_fan]
pin: !nozzle_mcu: PB3
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.1
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0
heater: extruder
fan_speed: 1.0
heater_temp: 60.0

[output_pin en_nozzle_fan]
pin: nozzle_mcu: PB7
pwm: False
value: 1.0

# Front part-cooling fan
[output_pin fan0]
pin: !nozzle_mcu: PB15
pwm: True
cycle_time: 0.01
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin en_fan0]
pin: nozzle_mcu: PB6
pwm: False
value: 1.0

# Rear part-cooling fan
[output_pin fan1]
pin: !nozzle_mcu: PA9
pwm: True
cycle_time: 0.01
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin en_fan1]
pin: nozzle_mcu: PB9
pwm: False
value: 1.0


# ─── LEDs ─────────────────────────────────────────────────────────
[output_pin green_pin]
pin: PA0
value: 0.0

[output_pin red_pin]
pin: PC1
value: 0.0

[output_pin yellow_pin]
pin: PA1
value: 1.0

[output_pin light_pin]
pin: !PC0
value: 0.0


# ─── Bed mesh (Eddy-ready; runs after Phase 6) ─────────────────────
[bed_mesh]
horizontal_move_z: 1
scan_overshoot: 8
# zero_reference_position: anchors the mesh's Z=0 reference to this
# single (X, Y) point. Klipper Eddy_Probe.md recommends this when
# combining tap-based G28 refinement (PRECISE_HOME / SET_Z_FROM_PROBE
# + SET_KINEMATIC_POSITION) with rapid_scan mesh — it keeps the mesh
# anchored at the same point where the tap set Z=0, ensuring the
# mesh's absolute reference doesn't drift from the kinematic frame
# even if PRECISE_HOME shifts the frame slightly.
# (200, 200) = bed center, same point PRECISE_HOME taps.
zero_reference_position: 200, 200
speed: 100
mesh_min: 30.0, 15.0
mesh_max: 391.0, 391.0
probe_count: 15, 15
fade_start: 1.0
fade_end: 10
fade_target: 0
mesh_pps: 4, 4
algorithm: bicubic
bicubic_tension: 0.2


# ─── Print management ─────────────────────────────────────────────
[virtual_sdcard]
path: /usr/data/printer_data/gcodes

[pause_resume]

[display_status]

[exclude_object]

# Enables the RESPOND gcode command (used by homing.cfg's user-facing
# status messages). Without this, "RESPOND TYPE=... MSG=..." inside any
# macro raises "Unknown command:\"RESPOND\"" and spams the console
# (cosmetic, doesn't break anything, but ugly).
[respond]

# Note: do not add a SAVE_CONFIG marker block here. Klipper appends one
# itself (with the correct trailing "#*#" line) when SAVE_CONFIG first
# runs. Hand-written markers without the exact trailing line trigger
# "config autosave is corrupted" — verified the hard way in May 2026.
